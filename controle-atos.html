:root{
  --bg:#EFECE1;
  --bg-alt:#E7E4D8;
  --card:#FBFAF6;
  --ink:#221F1A;
  --ink-soft:#6B675C;
  --line:#D9D4C6;

  /* tokens do redesign (design_handoff_protocolos) */
  --painel:#FBFAF6;
  --ficha:#FFFEFA;
  --apoio:#F4F1E7;
  --apoio-2:#F9F7EF;
  --barra-filtros:#E7E4D8;
  --tinta-media:#3F3C34;
  --tinta-media-2:#57544B;
  --apagado:#9A9587;
  --apagado-2:#B0AB9C;
  --carimbo:#8C2A20;
  --borda:#E0DCCE;
  --borda-ficha:#E6E1D2;
  --borda-forte:#D9D4C6;
  --borda-atraso:#D8A79B;
  --trilho:#E2DDCC;
  --divisor-suave:#EFEBDD;
  --r-card:10px;
  --r-field:8px;
  --r-chip:16px;
  --r-selo:5px;

  --gray:#57544B;      --gray-soft:#E7E4DA;
  --gold:#A26A1C;       --gold-soft:#F2E4C9;
  --blue:#2C3E5C;       --blue-soft:#E3E8F1;
  --plum:#5B3A5C;       --plum-soft:#EEE2EE;
  --green:#3E6B4B;      --green-soft:#E1EDE3;
  --dark:#4A4740;       --dark-soft:#E2DFD4;
  --teal:#1F6F66;       --teal-soft:#DCEDEA;
  --rose:#9C3B56;       --rose-soft:#F5E1E7;
  --stamp-red:#8C2A20;  --stamp-red-soft:#F3E1DC;

  --font-display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  --font-mono:'JetBrains Mono', Consolas, 'SFMono-Regular', 'Courier New', monospace;
  --radius:4px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- Header ---------- */
.letterhead{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding-bottom:16px;margin-bottom:6px;
  border-bottom:2px solid var(--ink);
  flex-wrap:wrap;gap:12px;
}
.letterhead h1{
  font-family:var(--font-display);font-weight:700;
  font-size:30px;margin:0 0 4px;letter-spacing:-0.01em;
}
.letterhead .eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ink-soft);
}
.header-rule2{border-bottom:1px solid var(--line);margin-bottom:20px;}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.today-line{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin-bottom:14px;}

.banner-warning{
  background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);
  padding:10px 14px;border-radius:var(--radius);font-size:12.5px;margin-bottom:16px;
}
.banner-ok{
  background:var(--green-soft);color:var(--green);border:1px solid var(--green);
  padding:10px 14px;border-radius:var(--radius);font-size:12.5px;margin-bottom:16px;
}
.banner-info{
  background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue);
  padding:10px 14px;border-radius:var(--radius);font-size:12.5px;margin-bottom:16px;
}
.banner-link{
  background:none;border:none;color:inherit;text-decoration:underline;
  font-size:12.5px;cursor:pointer;padding:0;font-family:var(--font-body);
}

/* ---------- Buttons ---------- */
button{font-family:var(--font-body);cursor:pointer;}
.btn{
  border:1px solid var(--ink);background:var(--card);color:var(--ink);
  padding:8px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:600;
  transition:transform .12s ease, background .12s ease;
}
.btn:hover{background:var(--ink);color:var(--card);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ink);color:var(--card);}
.btn-primary:hover{background:var(--stamp-red);border-color:var(--stamp-red);}
.btn-ghost{border:1px solid transparent;background:transparent;color:var(--ink-soft);padding:6px 10px;font-size:13px;border-radius:var(--radius);transition:background .15s ease, color .15s ease, border-color .15s ease;}
.btn-ghost:hover{background:var(--bg-alt);color:var(--ink);}
.btn-ghost.outlined{border:1px solid var(--line);}
.btn-danger{border:1px solid var(--stamp-red);color:var(--stamp-red);background:transparent;}
.btn-danger:hover{background:var(--stamp-red);color:#fff;}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--ink-soft);flex-shrink:0;
  transition:border-color .15s ease, color .15s ease, transform .1s ease;
}
.icon-btn:hover{border-color:var(--ink);color:var(--ink);}
.icon-btn:active{transform:scale(0.92);}
.mini-btn{width:24px;height:24px;border:1px solid var(--line);background:var(--card);border-radius:3px;font-size:11px;color:var(--ink-soft);transition:border-color .15s ease, color .15s ease, transform .1s ease;}
.mini-btn:hover{border-color:var(--ink);color:var(--ink);}
.mini-btn:active{transform:scale(0.9);}
.mini-btn:disabled{opacity:0.35;cursor:not-allowed;}
.remove-x{color:var(--stamp-red);background:none;border:none;font-size:15px;font-weight:700;padding:2px 6px;transition:transform .1s ease;}
.remove-x:hover{transform:scale(1.15);}
.remove-x:disabled{opacity:0.3;cursor:not-allowed;}

/* ---------- Stats ---------- */
.stats-bar{
  display:flex;gap:0;margin:22px 0;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  flex-wrap:wrap;
}
.stat{
  flex:1;min-width:110px;padding:14px 10px;text-align:center;
  border-right:1px solid var(--line);
}
.stat:last-child{border-right:none;}
.stat .num{font-family:var(--font-mono);font-size:22px;font-weight:700;line-height:1;}
.stat .lbl{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-top:6px;}
.stat.alert .num{color:var(--stamp-red);}

/* ---------- Filters ---------- */
.filters-bar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
}
.search-input{
  flex:1;min-width:180px;padding:9px 12px 9px 30px;border:1px solid var(--borda-forte);
  border-radius:var(--r-field);font-size:13.5px;background:var(--painel);color:var(--ink);
  font-family:var(--font-body);
}
.search-input:focus{outline:2px solid var(--blue);outline-offset:1px;}
select.sortsel{
  padding:8px 10px;border:1px solid var(--borda-forte);border-radius:var(--r-field);
  font-size:12.5px;background:var(--painel);color:var(--ink);font-family:var(--font-body);
}
/* .segmented/.seg-btn seguem usados pelo painel de criar/editar (canais, pessoa, docs) — nao alterar */
.segmented{display:flex;gap:6px;flex-wrap:wrap;}
.seg-btn{
  padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;
  font-size:12.5px;color:var(--ink-soft);font-weight:500;
  transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
}
.seg-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.seg-btn:active{transform:scale(0.96);}
.hint{font-size:11.5px;color:var(--ink-soft);margin:4px 0 10px;}

/* Segmentado de visao (Lista/Quadro/Arquivados/Lixeira) — barra de filtros redesenhada */
.seg2{display:flex;background:#DAD6C7;border-radius:var(--r-field);padding:2px;flex-wrap:wrap;}
.seg2-btn{border:none;background:transparent;color:var(--tinta-media-2);border-radius:6px;padding:6px 14px;font:500 12.5px var(--font-body);cursor:pointer;transition:background .12s ease,color .12s ease,box-shadow .12s ease;white-space:nowrap;}
.seg2-btn.active{background:var(--painel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12);}

/* Botao Filtrar + painel recolhivel */
.filtro-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink);background:var(--painel);color:var(--ink);border-radius:var(--r-field);padding:8px 13px;font:600 12.5px var(--font-body);cursor:pointer;white-space:nowrap;transition:background .12s ease,color .12s ease;}
.filtro-btn:hover,.filtro-btn.aberto{background:var(--ink);color:var(--painel);}
.filtro-contador{font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--ink);color:var(--painel);border-radius:9px;padding:2px 6px;}
.filtro-btn:hover .filtro-contador,.filtro-btn.aberto .filtro-contador{background:var(--painel);color:var(--ink);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--apagado);pointer-events:none;}

.painel-filtros{background:var(--apoio);border-radius:var(--r-card);padding:16px 18px;margin:0 0 14px;}
.pf-grid{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;}
.pf-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);text-align:right;}
.pf-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip-filtro{padding:5px 11px;border-radius:var(--r-chip);border:1px solid var(--borda);background:var(--painel);color:var(--tinta-media-2);font:500 11.5px var(--font-body);cursor:pointer;white-space:nowrap;transition:background .12s ease,color .12s ease,border-color .12s ease;}
.chip-filtro:hover{border-color:var(--ink);}
.chip-filtro.active{background:var(--ink);color:var(--painel);border-color:var(--ink);font-weight:600;}
.chip-filtro.pf.active{background:var(--plum);border-color:var(--plum);}
.chip-filtro.pj.active{background:var(--blue);border-color:var(--blue);}
.pf-divisor{width:1px;height:18px;background:var(--borda);margin:0 4px;}
.pf-toggle{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--font-body);color:var(--tinta-media-2);cursor:pointer;user-select:none;}
.toggle-track{width:26px;height:15px;border-radius:9px;background:var(--borda-forte);position:relative;display:inline-block;transition:background .15s ease;flex-shrink:0;}
.toggle-track.on{background:var(--ink);}
.toggle-knob{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--painel);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s ease;}
.toggle-track.on .toggle-knob{left:13px;}
.pf-limpar{border:none;background:none;color:var(--carimbo);font:500 11.5px var(--font-body);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

/* ---------- List / Ficha ---------- */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
  border:1px dashed var(--line);border-radius:var(--radius);background:var(--card);
  animation:fadeSlideIn .2s ease-out;
}
.empty-state .big{font-family:var(--font-display);font-size:18px;color:var(--ink);margin-bottom:6px;}
.group-header{font-family:var(--font-display);font-size:15px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;}
.group-header:first-child{margin-top:0;}
.group-header .cnt{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}

.ficha{
  display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;
}
.ficha-bar{width:5px;flex-shrink:0;}
.ficha-body{flex:1;padding:14px 16px;min-width:0;}
.ficha-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.ficha-ident{display:flex;flex-direction:column;gap:2px;}
.ficha-date{font-family:var(--font-mono);font-size:13px;font-weight:700;}
.ficha-num{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
.ficha-cliente{font-family:var(--font-display);font-size:16.5px;margin-top:2px;cursor:pointer;text-decoration:underline dotted 1px;text-underline-offset:3px;transition:color .12s ease;}
.ficha-cliente:hover{color:var(--stamp-red);}
.ficha-cliente.empty{color:var(--ink-soft);font-style:italic;font-family:var(--font-body);font-size:13px;cursor:default;text-decoration:none;}
.ficha-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.ficha-actions{display:flex;gap:4px;align-items:center;}
.ficha-mid{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center;}
.tag{
  font-size:11px;padding:3px 9px;border-radius:3px;background:var(--bg-alt);color:var(--ink-soft);
  border:1px solid var(--line);transition:transform .1s ease;
}
.canal-tag{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;}
.pessoa-tag{font-family:var(--font-mono);font-weight:700;letter-spacing:0.03em;}
.pessoa-tag.pf{color:var(--blue);background:var(--blue-soft);border-color:var(--blue);}
.pessoa-tag.pj{color:var(--teal);background:var(--teal-soft);border-color:var(--teal);}

.stamp{
  display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10.5px;
  text-transform:uppercase;letter-spacing:0.05em;font-weight:700;
  padding:4px 10px;border-radius:3px;transform:rotate(-1deg);
  border:1.5px solid currentColor;white-space:nowrap;
}
.stamp.gray{color:var(--gray);background:var(--gray-soft);}
.stamp.gold{color:var(--gold);background:var(--gold-soft);}
.stamp.blue{color:var(--blue);background:var(--blue-soft);}
.stamp.plum{color:var(--plum);background:var(--plum-soft);}
.stamp.green{color:var(--green);background:var(--green-soft);}
.stamp.dark{color:var(--dark);background:var(--dark-soft);text-decoration:line-through;}
.stamp.teal{color:var(--teal);background:var(--teal-soft);}
.stamp.rose{color:var(--rose);background:var(--rose-soft);}

.status-select{
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;
  font-weight:700;border-radius:3px;padding:5px 8px;border:1.5px solid currentColor;
  background:transparent;cursor:pointer;max-width:210px;
  transition:opacity .15s ease;
}
.status-select:hover{opacity:0.8;}

.ficha-bottom{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  padding-top:10px;border-top:1px dashed var(--line);
}
.docs-pending{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.prazo-info{display:flex;align-items:center;gap:10px;}
.prazo-text{font-size:12.5px;font-family:var(--font-mono);}
.prazo-text.ok{color:var(--green);}
.prazo-text.warn{color:var(--gold);}
.prazo-text.late{color:var(--stamp-red);font-weight:700;}
.dots{display:flex;gap:3px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s ease;}
.dot.filled{background:var(--blue);}
.dot.filled.late{background:var(--stamp-red);}
.obs{font-size:12.5px;color:var(--ink-soft);margin-top:8px;font-style:italic;}
.hist-toggle{font-size:11.5px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;padding:0;margin-top:8px;transition:color .12s ease;}
.hist-toggle:hover{color:var(--ink);}
.hist-box{margin-top:8px;padding:8px 10px;background:var(--bg-alt);border-radius:3px;font-size:12px;}
.hist-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line);}
.hist-row:last-child{border-bottom:none;}
.hist-row .hd{font-family:var(--font-mono);color:var(--ink-soft);font-size:11px;}

/* ---------- Kanban ---------- */
.kanban-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-behavior:smooth;}
.kanban-col{flex:0 0 250px;background:var(--bg-alt);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:75vh;transition:background .15s ease, border-color .15s ease;}
.kanban-col.drag-over{background:var(--blue-soft);border-color:var(--blue);}
.kanban-col-header{margin:10px;text-align:center;justify-content:center;}
.kanban-col-body{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;}
.kanban-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:9px 10px;cursor:grab;font-size:12.5px;transition:transform .12s ease, box-shadow .12s ease;}
.kanban-card:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,0.08);}
.kanban-card:active{cursor:grabbing;transform:scale(0.98);}
.k-top{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
.k-cliente{font-family:var(--font-display);font-size:13.5px;margin-bottom:6px;}
.k-tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:3px;font-family:var(--font-mono);}
.k-tag.ok{background:var(--green-soft);color:var(--green);}
.k-tag.warn{background:var(--gold-soft);color:var(--gold);}
.k-tag.late{background:var(--stamp-red-soft);color:var(--stamp-red);}
.kanban-empty{font-size:12px;color:var(--ink-soft);text-align:center;padding:14px 0;font-style:italic;}
.kanban-hint{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(34,31,26,0.55);
  display:flex;align-items:flex-start;justify-content:center;
  padding:30px 16px;overflow-y:auto;z-index:50;
}
.overlay.entering{animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
@keyframes modalPop{from{opacity:0;transform:scale(0.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.anim-in{animation:fadeSlideIn .2s ease;}
@keyframes highlightNew{0%{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold);}75%{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold);}100%{background:var(--card);box-shadow:0 0 0 0 rgba(0,0,0,0);}}
.ficha-new{animation:highlightNew 1.8s ease;}
.ficha{transition:box-shadow .15s ease;}
.ficha:hover{box-shadow:0 2px 10px rgba(34,31,26,0.06);}
.modal{
  background:var(--card);border-radius:6px;max-width:580px;width:100%;
  padding:24px 26px 26px;box-shadow:0 12px 40px rgba(0,0,0,0.25);
}
.modal.entering{animation:modalPop .2s cubic-bezier(.2,.8,.3,1);}
.modal.wide{max-width:640px;}
.modal h2{font-family:var(--font-display);font-size:21px;margin:0 0 18px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
.field input[type=text], .field input[type=date], .field textarea, .field select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);
  font-family:var(--font-body);font-size:13.5px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:56px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.checklist{
  border:1px solid var(--line);border-radius:var(--radius);padding:10px;
  max-height:170px;overflow-y:auto;background:#fff;
}
.checklist label{
  display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 2px;
  text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400;
}
.checklist input[type=checkbox]{margin:0;}
.add-tipo-row{display:flex;gap:6px;margin-top:8px;}
.add-tipo-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px;}
.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
.modal-actions-right{display:flex;gap:8px;}

/* ---------- Painel lateral de criar/editar (Fase 2 do redesign) ----------
   Classes proprias (side-*), independentes de .overlay/.modal, que continuam
   servindo Configuracoes/Historico/Relatorio/Atos de balcao sem alteracao. */
@keyframes panelSlideIn{from{transform:translateX(28px);opacity:.3;}to{transform:translateX(0);opacity:1;}}
.side-overlay{position:fixed;inset:0;background:rgba(34,31,26,0.45);display:flex;justify-content:flex-end;z-index:50;}
.side-overlay.entering{animation:fadeIn .18s ease;}
.side-panel{background:var(--painel);width:100%;max-width:640px;height:100vh;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);}
.side-panel.w-1000{max-width:1000px;}
.side-panel.w-520{max-width:520px;}
.side-panel.w-440{max-width:440px;}
.side-panel.entering{animation:panelSlideIn .2s cubic-bezier(.2,.8,.3,1);}
.side-panel-head{padding:22px 26px 16px;border-bottom:1px solid var(--borda-forte);flex-shrink:0;}
.side-panel-head h2{font-family:var(--font-display);font-size:21px;margin:0;}
.side-panel-body{flex:1;overflow-y:auto;padding:20px 26px;}
.side-panel-body.edit-grid{display:grid;grid-template-columns:1fr 320px;padding:0;overflow:hidden;}
.fm-edit-col-left{padding:20px 24px;overflow-y:auto;min-width:0;}
.fm-edit-col-right{background:var(--apoio);border-left:1px solid var(--borda-forte);display:flex;flex-direction:column;overflow-y:auto;}
.fm-diario-bloco{padding:16px 18px;border-bottom:1px solid var(--borda-forte);}
.fm-diario-bloco:last-child{border-bottom:none;}
.fm-obs-box{border:1px solid var(--borda-forte);background:var(--ficha);border-radius:var(--r-field);padding:9px 11px;}
.fm-obs-box textarea{width:100%;box-sizing:border-box;border:none;outline:none;background:transparent;resize:none;min-height:38px;color:var(--ink);font-family:var(--font-body);font-size:12px;line-height:1.5;padding:0;}
@media (max-width:760px){
  .side-panel-body.edit-grid{grid-template-columns:1fr;}
  .fm-edit-col-right{border-left:none;border-top:1px solid var(--borda-forte);}
}
.side-panel-foot{flex-shrink:0;padding:14px 26px;border-top:1px solid var(--borda-forte);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--painel);}
.side-panel-foot-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.side-esc-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--apagado);}

/* Formulario de criar/editar — secoes numeradas (Fase 2 parte 2) */
.fm-sec{display:flex;flex-direction:column;gap:12px;padding:18px 0;border-bottom:1px solid var(--divisor-suave);}
.fm-sec:first-of-type{padding-top:0;}
.fm-sec-head{display:flex;align-items:center;gap:9px;}
.fm-sec-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;}
.fm-sec-rule{flex:1;height:1px;background:var(--divisor-suave);}
.fm-sec-count{font-size:10.5px;color:var(--apagado-2);white-space:nowrap;}
.fm-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
.fm-field{flex:1;min-width:150px;}
.fm-field.fixo{flex:none;}
.fm-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);margin-bottom:6px;display:block;}
.fm-input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--borda-forte);border-radius:var(--r-field);background:var(--ficha);color:var(--ink);font-family:var(--font-body);font-size:12.5px;}
.fm-input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(34,31,26,.07);}
.fm-input-nome{font-family:var(--font-display);font-size:17px;font-weight:600;padding:11px 13px;}
.fm-input-mono{font-family:var(--font-mono);font-size:12.5px;}
.fm-input.ta{min-height:64px;resize:vertical;font-family:var(--font-body);}
.fm-input-row{display:flex;gap:6px;}
.fm-input-row .fm-input{flex:1;min-width:0;}
.fm-aux-btn{flex:none;width:32px;border:1px solid var(--borda-forte);background:var(--painel);border-radius:var(--r-field);color:var(--tinta-media-2);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;}
.fm-aux-btn:hover{border-color:var(--ink);color:var(--ink);}
.fm-aux-btn.wpp{color:var(--teal);}
.fm-aux-btn.wpp:hover{border-color:var(--teal);}

.fm-warn{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--gold-soft);border:1px solid #E0C88E;border-radius:var(--r-field);}
.fm-warn-bang{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--gold);flex-shrink:0;}
.fm-warn-txt{flex:1;font-size:12px;line-height:1.4;color:#7A4F13;}
.fm-warn-btn{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:var(--r-field);padding:6px 11px;font:600 11.5px var(--font-body);cursor:pointer;white-space:nowrap;}
.fm-warn-btn:hover{background:var(--gold);color:var(--gold-soft);}

.fm-seg-pessoa{display:flex;background:var(--barra-filtros);border-radius:9px;padding:3px;width:fit-content;}
.fm-seg-pessoa button{border:none;background:transparent;color:var(--tinta-media-2);border-radius:6px;padding:7px 18px;font:500 12px var(--font-body);cursor:pointer;}
.fm-seg-pessoa button.active.pf{background:var(--plum);color:var(--painel);font-weight:600;}
.fm-seg-pessoa button.active.pj{background:var(--blue);color:var(--painel);font-weight:600;}

.fm-chip{padding:7px 12px;border-radius:var(--r-field);border:1px solid var(--borda);background:var(--painel);color:var(--tinta-media-2);font:500 12px var(--font-body);cursor:pointer;white-space:nowrap;}
.fm-chip:hover{border-color:var(--ink);}
.fm-chip.active{background:var(--ink);color:var(--painel);border-color:var(--ink);font-weight:600;}
.fm-chip.canal.active{background:var(--blue);border-color:var(--blue);}

.fm-tiposearch-wrap{position:relative;}
.fm-dropdown{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--ficha);border:1px solid var(--borda);border-radius:var(--r-field);box-shadow:0 6px 18px -12px rgba(0,0,0,.3);z-index:5;max-height:220px;overflow-y:auto;}
.fm-dropdown-item{padding:8px 12px;border-bottom:1px solid var(--divisor-suave);font-size:12.5px;color:var(--tinta-media-2);cursor:pointer;}
.fm-dropdown-item:last-child{border-bottom:none;}
.fm-dropdown-item:hover{background:var(--apoio);color:var(--ink);}
.fm-dropdown-empty{padding:10px 12px;font-size:12px;color:var(--apagado);font-style:italic;}

.fm-prazo-box{border:1px solid #A9C4B2;background:#EDF4EE;border-radius:9px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.fm-prazo-toggle-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:210px;}
.fm-toggle-lg{width:38px;height:22px;border-radius:12px;background:var(--borda-forte);position:relative;display:inline-block;flex-shrink:0;cursor:pointer;transition:background .15s ease;}
.fm-toggle-lg.on{background:var(--green);}
.fm-toggle-lg .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--painel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s ease;}
.fm-toggle-lg.on .knob{left:19px;}
.fm-prazo-toggle-lbl{font:600 13px var(--font-body);color:#2F5039;}
.fm-prazo-sub{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#7C9384;}
.fm-prazo-recebida input{margin-top:4px;width:110px;padding:7px 10px;border:1px solid #A9C4B2;border-radius:7px;background:var(--ficha);color:var(--ink);font-family:var(--font-mono);font-size:12.5px;}
.fm-prazo-divisor{padding-left:14px;border-left:1px solid #C6D9CB;}
.fm-prazo-venc{font-family:var(--font-mono);font-weight:700;font-size:15px;color:#2F5039;margin-top:3px;}
.fm-hint{font-size:11px;color:var(--apagado);}

.fm-disclosure{border:1px dashed var(--borda-forte);background:transparent;color:var(--tinta-media-2);border-radius:var(--r-field);padding:9px 12px;font:500 12px var(--font-body);cursor:pointer;text-align:left;width:100%;}
.fm-disclosure:hover{border-color:var(--ink);color:var(--ink);}

/* Abertura rapida (3a) */
.fm-quick-body{display:flex;flex-direction:column;gap:18px;}
.fm-input.dashed{border-style:dashed;background:var(--painel);}
.fm-disclosure-big{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px dashed var(--borda-forte);background:var(--apoio);border-radius:9px;padding:12px 14px;cursor:pointer;font-family:var(--font-body);text-align:left;transition:border-color .12s ease;}
.fm-disclosure-big:hover{border-color:var(--ink);}
.fm-disclosure-big-lbl{font:600 12.5px var(--font-body);color:var(--ink);}
.fm-disclosure-big-sub{font:400 11px var(--font-body);color:var(--apagado);white-space:nowrap;}

/* settings */
.settings-section{margin-bottom:22px;}
.settings-section h3{font-family:var(--font-display);font-size:15px;margin:0 0 4px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px;gap:8px;}
.list-row:last-child{border-bottom:none;}
.status-row{display:flex;gap:6px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.status-row:last-child{border-bottom:none;}
.status-row input[type=text]{flex:1;min-width:140px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;font-size:12.5px;}
.status-row select{padding:6px 8px;border:1px solid var(--line);border-radius:3px;font-size:12px;}
.status-row .final-lbl{font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;white-space:nowrap;}
.swatch{width:15px;height:15px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,0.15);flex-shrink:0;}
.new-status-form{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}

/* daily report */
.report-section{margin-bottom:18px;}
.report-section h3{font-family:var(--font-display);font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
.report-section h3 .count{font-family:var(--font-mono);font-size:12px;background:var(--bg-alt);padding:2px 8px;border-radius:10px;color:var(--ink-soft);}
.report-row{font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;}
.report-row:last-child{border-bottom:none;}
.report-empty{font-size:12px;color:var(--ink-soft);font-style:italic;}

@media (max-width:600px){
  .letterhead{flex-direction:column;align-items:flex-start;}
  .stat{min-width:33%;border-bottom:1px solid var(--line);}
  .field-row{flex-direction:column;gap:0;}
}

/* ===================== REDESIGN Fase 1 — Lista (design_handoff_protocolos) ===================== */
/* Régua de números — substitui a barra de 7 stats */
.regua{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:18px 0 4px;}
.regua-item{display:flex;flex-direction:column;gap:3px;padding:2px 16px 2px 0;margin-right:16px;border-right:1px solid var(--borda-forte);cursor:pointer;}
.regua-item:last-of-type{border-right:none;}
.regua-item .rn{font-family:var(--font-mono);font-size:17px;font-weight:700;line-height:1;color:var(--tinta-media);}
.regua-item .rl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);}
.regua-item:hover .rn{color:var(--ink);}
.regua-item.on .rn{color:var(--ink);}
.regua-item.on{border-bottom:2px solid var(--ink);margin-bottom:-2px;}
.regua-item.warn .rn{color:var(--gold);}
.regua-item.late .rn{color:var(--carimbo);}
.regua-data{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--apagado);}

/* Ficha (cartão de protocolo) */
.cp{display:grid;grid-template-columns:5px 1fr 158px;background:var(--ficha);border:1px solid var(--borda-ficha);border-radius:var(--r-card);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .12s ease,border-color .12s ease;}
.cp:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
.cp.atraso{border-color:var(--borda-atraso);}
.cp-barra{width:5px;}
.cp-corpo{padding:15px 18px;display:flex;flex-direction:column;gap:9px;min-width:0;}
.cp-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cp-num{font-family:var(--font-mono);font-size:11px;color:var(--apagado);}
.cp-resp{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--apagado);}
.selo{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;border-radius:var(--r-selo);padding:2px 8px;border:1px solid currentColor;background:transparent;line-height:1.4;}
.selo.pf{color:var(--plum);}
.selo.pj{color:var(--blue);}
.tag-atraso{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--carimbo);color:var(--painel);padding:2px 7px;border-radius:3px;}
.cp-nome{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.2;cursor:pointer;text-wrap:pretty;}
.cp-nome:hover{color:var(--carimbo);}
.cp-nome.vazio{font-family:var(--font-body);font-size:13px;font-weight:400;font-style:italic;color:var(--apagado);cursor:default;}
.cp-tipo{font-size:13px;color:var(--tinta-media-2);text-wrap:pretty;}
.cp-rodape{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.chip-status{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:11.5px;font-weight:600;border-radius:var(--r-chip);padding:4px 11px 4px 9px;border:none;cursor:pointer;-webkit-appearance:none;appearance:none;}
.chip-status .pt{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cp-canais{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--apagado);}
.cp-acoes{margin-left:auto;display:flex;gap:4px;}
.ib28{width:28px;height:28px;border-radius:7px;border:1px solid var(--borda-forte);background:var(--painel);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--tinta-fraca,var(--ink-soft));cursor:pointer;transition:border-color .12s,color .12s;}
.ib28:hover{border-color:var(--ink);color:var(--ink);}

/* Bloco de prazo (coluna direita) */
.cp-prazo{padding:12px 13px;display:flex;flex-direction:column;gap:7px;border-left:1px solid var(--borda-ficha);background:#F2F6F1;}
.cp-prazo.hoje{background:#FAF2E1;}
.cp-prazo.atraso{background:#F8E9E5;}
.cp-prazo.sem{background:var(--apoio);}
.prazo-rot{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);}
.trilha{display:flex;gap:4px;}
.marca{width:16px;height:8px;border-radius:2px;background:var(--trilho);}
.prazo-txt{font-family:var(--font-mono);font-size:12px;font-weight:700;}
.prazo-txt.ok{color:var(--green);}
.prazo-txt.warn{color:var(--gold);}
.prazo-txt.late{color:var(--carimbo);}
.prazo-vence{font-family:var(--font-mono);font-size:10px;color:var(--apagado);}
.btn-avancar{margin-top:2px;width:100%;background:var(--ink);color:var(--painel);border:none;border-radius:var(--r-field);padding:7px 8px;font-family:var(--font-body);font-size:11px;font-weight:600;cursor:pointer;transition:background .12s;}
.btn-avancar:hover{background:var(--carimbo);}
.prazo-acao{font-family:var(--font-body);font-size:11px;color:var(--tinta-fraca,var(--ink-soft));}

/* Quadro (Kanban) redesenhado */
.kb-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(224px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px;}
.kb-col{background:var(--apoio);border-radius:var(--r-card);display:flex;flex-direction:column;max-height:74vh;transition:background .12s;}
.kb-head{display:flex;align-items:center;gap:7px;margin:12px 12px 0;padding-bottom:9px;border-bottom:2px solid var(--borda-forte);}
.kb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.kb-head .kl{font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--tinta-media);}
.kb-head .kc{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--apagado);}
.kb-body{flex:1;overflow-y:auto;padding:10px 10px 2px;display:flex;flex-direction:column;gap:8px;}
.kb-card{background:var(--ficha);border:1px solid var(--borda-ficha);border-left:3px solid var(--borda-forte);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .12s;}
.kb-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
.kb-card:active{cursor:grabbing;}
.kb-card.pf{border-left-color:var(--plum);}
.kb-card.pj{border-left-color:var(--blue);}
.kb-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.kb-num{font-family:var(--font-mono);font-size:10px;color:var(--apagado);}
.kb-tag-atraso{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.04em;background:var(--carimbo);color:var(--painel);padding:1px 6px;border-radius:3px;}
.kb-nome{font-family:var(--font-display);font-size:14.5px;font-weight:600;line-height:1.2;text-wrap:pretty;}
.kb-tipo{font-size:11px;color:var(--tinta-media-2);text-wrap:pretty;}
.kb-prazo{display:flex;align-items:center;gap:7px;}
.trilha-mini{display:flex;gap:3px;}
.marca-mini{width:9px;height:6px;border-radius:2px;background:var(--trilho);}
.kb-prazo-txt{font-family:var(--font-mono);font-size:10.5px;font-weight:700;}
.kb-prazo-txt.ok{color:var(--green);}
.kb-prazo-txt.warn{color:var(--gold);}
.kb-prazo-txt.late{color:var(--carimbo);}
.kb-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px dashed #EAE5D6;padding-top:6px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--apagado);}
.kb-vazio{font-size:11.5px;color:var(--apagado);text-align:center;padding:10px 0;font-style:italic;}
.kb-dropzone{display:none;margin:4px 10px 10px;border:2px dashed var(--teal);background:var(--teal-soft);border-radius:8px;padding:16px 12px;text-align:center;font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--teal);}
.kb-board.is-dragging .kb-dropzone{display:block;}
.kb-col.alvo{background:#EAF3F1;}
.kb-col.alvo .kb-dropzone{background:#CDE7E2;}

/* ---------- Vinculo entre protocolos (5a/5b/5c) ---------- */
.pill-vinculo{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:12px;background:var(--plum-soft);color:var(--plum);white-space:nowrap;}
.grp-wrap{margin-bottom:12px;}
.grp-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:2px 0 8px;}
.grp-nome{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--ink);}
.grp-link{border:none;background:none;color:var(--tinta-media-2);font-size:11px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0;}
.grp-link:hover{color:var(--ink);}
.grp-link.danger{color:var(--apagado-2);}
.grp-link.danger:hover{color:var(--carimbo);}
.grp-grid{display:grid;grid-template-columns:26px 1fr;gap:0;}
.grp-chave{position:relative;}
.grp-fio{position:absolute;left:11px;top:22px;bottom:22px;width:2px;background:var(--plum);border-radius:1px;}
.grp-fio::before,.grp-fio::after{content:'';position:absolute;left:0;width:12px;height:2px;background:var(--plum);}
.grp-fio::before{top:0;}
.grp-fio::after{bottom:0;}
.grp-disco{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--plum-soft);border:1.5px solid var(--plum);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--plum);}
.grp-fichas{display:flex;flex-direction:column;gap:8px;min-width:0;}

.diarios-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:14px;border-bottom:1.5px solid var(--ink);}
.diarios-nome{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--ink);}
.diarios-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;border:1px solid var(--borda);border-radius:var(--r-card);overflow:hidden;background:var(--ficha);}
.diario-col{padding:16px 20px 22px;border-right:1px solid var(--borda);}
.diario-col:last-child{border-right:none;}
.diario-col.alt{background:var(--apoio-2);}
.diario-col-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--divisor-suave);}
.diario-num{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink);}
.diario-prazo{font-family:var(--font-mono);font-size:10px;font-weight:700;}
.diario-tipo{font-size:12px;color:var(--tinta-media-2);margin-top:8px;}
.diario-entries{display:flex;flex-direction:column;margin-top:6px;}
.diario-entry{padding:11px 0;border-bottom:1px solid var(--divisor-suave);}
.diario-entry:last-child{border-bottom:none;}
.diario-ts{font-family:var(--font-mono);font-size:10px;color:var(--apagado);}
.diario-txt{font-size:12.5px;line-height:1.5;color:var(--tinta-media);margin-top:4px;text-wrap:pretty;}

/* Painel de vinculo dedicado (5b) */
.vp-search-wrap{position:relative;}
.vp-sec-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
.vp-sec-hint{font-size:10.5px;color:var(--apagado-2);}
.vp-linha{display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:flex-start;background:var(--painel);border:1px solid var(--borda);border-radius:9px;padding:11px 12px;}
.vp-linha.sel{background:var(--apoio);border-color:var(--ink);}
.vp-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--borda-forte);background:var(--painel);color:var(--painel);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;margin-top:1px;flex-shrink:0;}
.vp-check.on{background:var(--ink);border-color:var(--ink);}
.vp-linha-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.vp-num{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink);}
.vp-quando{font-family:var(--font-mono);font-size:9.5px;color:var(--apagado-2);}
.vp-tipo{font-size:12.5px;color:var(--tinta-media);margin-top:4px;text-wrap:pretty;}
.vp-motivo-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
.vp-motivo{font-family:var(--font-mono);font-size:9.5px;color:var(--apagado);}
.vp-dispensar{border:none;background:none;color:var(--apagado-2);font-size:10.5px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0;}
.vp-dispensar:hover{color:var(--carimbo);}
.vp-nota{background:var(--apoio);border:1px dashed var(--borda-forte);border-radius:9px;padding:11px 13px;font-size:11.5px;line-height:1.5;color:var(--tinta-media-2);margin-top:16px;text-wrap:pretty;}

/* ---------- Atos de balcao (6a painel + 6b faixa) ---------- */
.ab-total-box{background:var(--ficha);border:1px solid var(--borda-forte);border-radius:12px;padding:20px;display:flex;align-items:center;gap:18px;}
.ab-total-num{font-family:var(--font-mono);font-weight:700;font-size:52px;line-height:1;color:var(--ink);}
.ab-editar-link{border:none;background:none;color:var(--apagado-2);font-size:11px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.ab-editar-link:hover{color:var(--ink);}
.ab-total-edit-input{width:90px;font-family:var(--font-mono);font-size:28px;font-weight:700;text-align:center;border:1px solid var(--ink);border-radius:8px;padding:4px 6px;background:var(--painel);color:var(--ink);}
.ab-acoes-col{display:flex;flex-direction:column;gap:8px;align-items:stretch;}
.ab-btn-mais1{border:1px solid var(--ink);background:var(--ink);color:var(--painel);border-radius:10px;padding:16px 26px;font-family:var(--font-mono);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:background .12s ease;}
.ab-btn-mais1:hover{background:var(--carimbo);border-color:var(--carimbo);}
.ab-btn-mais1:active{transform:scale(.96);}
.ab-btn-menos1{border:1px solid var(--borda-forte);background:var(--painel);color:var(--tinta-media-2);border-radius:8px;padding:6px 10px;font-family:var(--font-mono);font-size:13px;font-weight:700;cursor:pointer;}
.ab-btn-menos1:hover{border-color:var(--carimbo);color:var(--carimbo);}
.ab-somar-row{display:flex;align-items:flex-end;gap:8px;}
.ab-somar-input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--borda-forte);border-radius:8px;background:var(--ficha);color:var(--ink);font-family:var(--font-mono);font-size:15px;font-weight:700;text-align:center;}
.ab-somar-btn{flex-shrink:0;border:1px solid var(--ink);background:var(--painel);color:var(--ink);border-radius:8px;padding:11px 16px;font:600 12.5px var(--font-body);cursor:pointer;}
.ab-somar-btn:hover{background:var(--ink);color:var(--painel);}
.ab-lancamentos-box{background:var(--apoio);border-radius:9px;padding:12px 14px;}
.ab-lancamentos-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.ab-desfazer-link{border:none;background:none;color:var(--carimbo);font-size:11px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.ab-pilulas{display:flex;gap:6px;flex-wrap:wrap;}
.ab-pilula{display:inline-flex;align-items:baseline;gap:5px;padding:4px 9px;border-radius:14px;background:var(--ficha);border:1px solid var(--borda-forte);}

<div id="app"><div style="padding:60px;text-align:center;color:#6B675C;font-family:'JetBrains Mono',monospace;font-size:13px;">Carregando protocolos…</div></div>

<script>
(function(){
"use strict";

/* ===================== Constantes ===================== */
var PALETTE = [
  {key:'gray', name:'Cinza'},
  {key:'gold', name:'Dourado'},
  {key:'blue', name:'Azul'},
  {key:'plum', name:'Ameixa'},
  {key:'green', name:'Verde'},
  {key:'dark', name:'Cinza escuro (riscado)'},
  {key:'teal', name:'Verde-azulado'},
  {key:'rose', name:'Rosa'}
];

var DEFAULT_STATUS_LIST = [
  {key:'aguardando_documentos', label:'Aguardando documentos p/ análise', cor:'gray', isFinal:false, requerDigitalizacao:false},
  {key:'pendencia_documentos', label:'Pendência de documentos', cor:'gold', isFinal:false, requerDigitalizacao:false},
  {key:'em_analise', label:'Em análise pelo Tabelião', cor:'blue', isFinal:false, requerDigitalizacao:false},
  {key:'aguardando_assinatura', label:'Aguardando assinatura', cor:'plum', isFinal:false, requerDigitalizacao:false},
  {key:'finalizado', label:'Finalizado', cor:'green', isFinal:true, requerDigitalizacao:true},
  {key:'desistiu', label:'Cliente desistiu', cor:'dark', isFinal:true, requerDigitalizacao:false}
];

var CANAIS = [
  {key:'balcao', label:'Balcão'},
  {key:'whatsapp', label:'WhatsApp'},
  {key:'email', label:'E-mail'}
];
var CANAL_MAP = {};
CANAIS.forEach(function(c){ CANAL_MAP[c.key] = c; });

var DEFAULT_TIPOS = [
  'Procuração Ad Judicia',
  'Procuração Ad Negotia',
  'Procuração para venda de imóvel',
  'Procuração bancária/financeira',
  'Escritura de Compra e Venda',
  'Escritura de Doação',
  'Escritura de Inventário e Partilha',
  'Escritura de União Estável',
  'Escritura de Divórcio Consensual',
  'Escritura Declaratória'
];

var DEFAULT_DOCUMENTOS_CHECKLIST = [
  'RG',
  'CPF',
  'Comprovante de residência',
  'Certidão de casamento/nascimento'
];

/* Base fixa (nao editavel) que entra em TODO tipo de ato, procuracao ou escritura.
   Documentos especificos por tipo moram em state.checklistPorTipo e se somam a esta
   base (uniao, sem repetir); documentos extras adicionados so num protocolo
   especifico moram em p.documentosExtras. Ver getChecklistDoProtocolo(). */
var DOCUMENTOS_BASE_CHECKLIST = [
  'Documento de identificação com CPF do(s) outorgante(s)',
  'Documento de identificação com CPF do(s) outorgado(s)',
  'Qualificação do(s) outorgante(s)',
  'Qualificação do(s) outorgado(s)'
];
function getChecklistDoProtocolo(p){
  var lista = DOCUMENTOS_BASE_CHECKLIST.slice();
  (p.tipos||[]).forEach(function(t){
    (state.checklistPorTipo[t]||[]).forEach(function(doc){
      if(lista.indexOf(doc)===-1) lista.push(doc);
    });
  });
  (p.documentosExtras||[]).forEach(function(doc){
    if(lista.indexOf(doc)===-1) lista.push(doc);
  });
  return lista;
}

var PRAZO_DIAS_UTEIS = 5;
var STORAGE_KEY = 'cartorio-data';
var FS_IDB_NAME = 'cartorio-fs';
var FS_IDB_STORE = 'handles';
var FS_HANDLE_KEY = 'dataDir';
var FS_DATA_FILE = 'controle-atos-dados.json';
var FS_BACKUP_DIR = 'backups';
var FS_BACKUP_SLOTS = ['10:50', '17:45'];
var FS_BACKUP_RETENTION_DIAS = 60;

/* ===================== Estado ===================== */
var state = null;
var storageAvailable = true;
var memoryFallback = {};
var fsSupported = (typeof window !== 'undefined' && 'showDirectoryPicker' in window);
var fileMode = false;
var dirHandle = null;
var fsPendingHandle = null;
var fsStatus = 'init';   /* init | connected | reconnect | error | offer | unsupported */
var fsFolderName = '';
var fsWriting = false;
var fsPending = false;
var backupRunning = false;
var ui = {
  search:'', statusFilter:'all', canalFilter:'all', pessoaFilter:'all',
  onlyOverdue:false, onlyDueToday:false, onlyPendingDocs:false,
  sortBy:'prazo', viewMode:'lista', agruparPessoa:false, filtrosAbertos:false
};
var draftModal = null;
var draftModalSnapshot = null;
var settingsOpen = false;
var clienteHistoryModal = null;
var dailyReportOpen = false;
var atosBalcaoModalOpen = false;
var historicoAbertos = {};
var obsAbertos = {};
var vinculadosAbertos = {};
var diariosGrupoId = null;
var vinculoPanelFor = null;
var vinculoPanelSearch = '';
var vinculoPanelSelected = {};
var edicaoTotalBalcaoAberta = false;
var confirmandoExclusaoId = null;
var documentosAbertos = {};
var justOpenedKey = null;
var justCreatedId = null;
var justSwitchedView = false;
var obsDraftText = {};
var obsDraftEtiqueta = {};
var obsEditando = {};
var obsEditDraftText = {};
var obsEditDraftEtiqueta = {};
var ETIQUETAS_OBS = [
  {key:'ligou', label:'ligou', viva:'#2C3E5C', suave:'#E3E8F1'},
  {key:'enviou_doc', label:'enviou doc', viva:'#1F6F66', suave:'#DCEDEA'},
  {key:'compareceu', label:'compareceu', viva:'#5B3A5C', suave:'#EEE2EE'},
  {key:'aguard_retorno', label:'aguard. retorno', viva:'#A26A1C', suave:'#F2E4C9'}
];
function getEtiquetaObs(key){
  return ETIQUETAS_OBS.filter(function(e){ return e.key===key; })[0] || null;
}
function chaveDispensaVinculo(idA, idB){
  return idA<idB ? idA+'|'+idB : idB+'|'+idA;
}
var modalJustOpened = false;

function defaultState(){
  return {
    protocolos: [],
    tiposAtos: DEFAULT_TIPOS.slice(),
    statusList: DEFAULT_STATUS_LIST.map(function(s){ return Object.assign({},s); }),
    responsaveis: [],
    ultimoResponsavel: '',
    documentosChecklist: DEFAULT_DOCUMENTOS_CHECKLIST.slice(),
    feriadosExtras: [],
    feriadosMoveis: {carnaval:true, corpusChristi:true, sextaSanta:true},
    atosBalcao: {},
    atosBalcaoLancamentos: {},
    sugestoesDispensadas: {},
    checklistPorTipo: {}
  };
}

function migrate(raw){
  var s = raw || defaultState();
  if(!s.tiposAtos) s.tiposAtos = DEFAULT_TIPOS.slice();
  if(s.tiposAtos.length && typeof s.tiposAtos[0]!=='string'){
    s.tiposAtos = s.tiposAtos.map(function(t){ return typeof t==='string' ? t : t.nome; });
  }
  if(!s.statusList || !s.statusList.length){
    s.statusList = DEFAULT_STATUS_LIST.map(function(x){ return Object.assign({},x); });
  }
  s.statusList = s.statusList.map(function(st){
    if(st.requerDigitalizacao==null) st.requerDigitalizacao=false;
    return st;
  });
  var statusMapForMigration = {};
  s.statusList.forEach(function(st){ statusMapForMigration[st.key]=st; });
  if(!s.feriadosExtras) s.feriadosExtras=[];
  if(s.ultimoResponsavel==null) s.ultimoResponsavel='';
  if(!s.feriadosMoveis) s.feriadosMoveis={carnaval:true,corpusChristi:true,sextaSanta:true};
  if(!s.atosBalcao) s.atosBalcao={};
  if(!s.atosBalcaoLancamentos) s.atosBalcaoLancamentos={};
  if(!s.sugestoesDispensadas) s.sugestoesDispensadas={};
  s.protocolos = (s.protocolos||[]).map(function(p){
    if(!p.historico || !p.historico.length) p.historico=[{status:p.status, ts:p.createdAt||Date.now()}];
    if(!p.tipoPessoa) p.tipoPessoa='pf';
    if(p.outorgados==null) p.outorgados='';
    if(p.responsavel==null) p.responsavel='';
    if(p.clienteTelefone==null || p.clienteEmail==null){
      var legacyContato = p.clienteContato || '';
      if(p.clienteTelefone==null) p.clienteTelefone = (legacyContato && legacyContato.indexOf('@')===-1) ? legacyContato : '';
      if(p.clienteEmail==null) p.clienteEmail = (legacyContato && legacyContato.indexOf('@')!==-1) ? legacyContato : '';
    }
    if(p.clienteDocumento==null) p.clienteDocumento='';
    if(p.valorAto==null) p.valorAto=null;
    if(!p.documentosMarcados) p.documentosMarcados={};
    if(!p.documentosExtras) p.documentosExtras=[];
    if(!p.tipos) p.tipos=[];
    if(!p.canais){ p.canais = p.canal ? [p.canal] : ['balcao']; }
    if(!p.observacoesHistorico){
      p.observacoesHistorico = (p.observacoes && p.observacoes.trim()) ? [{texto:p.observacoes.trim(), ts:p.createdAt||Date.now()}] : [];
    }
    p.observacoesHistorico = p.observacoesHistorico.map(function(o){
      if(o.etiqueta===undefined) o.etiqueta=null;
      if(o.editadoEm===undefined) o.editadoEm=null;
      return o;
    });
    if(p.rascunhoDigitalizado===undefined){
      var stAtMigration = statusMapForMigration[p.status];
      if(stAtMigration && stAtMigration.isFinal){
        // Protocolo já estava finalizado/arquivado antes deste recurso existir: considera já arquivado.
        p.rascunhoDigitalizado = true;
        var lastFinalEntry = null;
        (p.historico||[]).forEach(function(h){ if(h.status===p.status) lastFinalEntry=h; });
        p.dataDigitalizacao = lastFinalEntry ? toISO(new Date(lastFinalEntry.ts)) : null;
      }else{
        p.rascunhoDigitalizado = false;
        p.dataDigitalizacao = null;
      }
    }
    if(p.dataDigitalizacao===undefined) p.dataDigitalizacao = null;
    if(p.grupoVinculoId===undefined) p.grupoVinculoId = null;
    if(p.naLixeira===undefined) p.naLixeira = false;
    if(p.dataExclusao===undefined) p.dataExclusao = null;
    return p;
  });
  if(!s.documentosChecklist) s.documentosChecklist = DEFAULT_DOCUMENTOS_CHECKLIST.slice();
  if(!s.checklistPorTipo) s.checklistPorTipo = {};
  if(!s.responsaveis){
    var seen = {};
    s.responsaveis = [];
    s.protocolos.forEach(function(p){
      if(p.responsavel && !seen[p.responsavel]){ seen[p.responsavel]=true; s.responsaveis.push(p.responsavel); }
    });
  }
  return s;
}

/* ===================== Persistência ===================== */
function ensureStorage(){
  if(!window.storage){
    storageAvailable=false;
    window.storage = {
      get:function(key){ return Promise.resolve(memoryFallback[key]!==undefined ? {key:key,value:memoryFallback[key],shared:false} : null); },
      set:function(key,value){ memoryFallback[key]=value; return Promise.resolve({key:key,value:value,shared:false}); },
      delete:function(key){ delete memoryFallback[key]; return Promise.resolve({key:key,deleted:true,shared:false}); },
      list:function(){ return Promise.resolve({keys:Object.keys(memoryFallback)}); }
    };
  }
}
function loadState(){
  return window.storage.get(STORAGE_KEY, false).then(function(res){
    if(res && res.value){
      try{ return migrate(JSON.parse(res.value)); }catch(e){ return defaultState(); }
    }
    return defaultState();
  }).catch(function(){ return defaultState(); });
}
function saveState(){
  if(fileMode && dirHandle){
    return fsFlush();
  }
  return window.storage.set(STORAGE_KEY, JSON.stringify(state), false).catch(function(e){
    console.error('Falha ao salvar dados', e);
  });
}

/* ===================== Armazenamento em pasta (File System Access) =====================
   Persistencia opcional numa PASTA local escolhida pelo usuario. Dentro dela o app mantem
   o arquivo de dados ao vivo (FS_DATA_FILE) e uma subpasta de backups (FS_BACKUP_DIR) com
   copias datadas geradas 2x/dia (FS_BACKUP_SLOTS), com "recuperacao na proxima abertura".
   Tudo fica so no computador — nada vai para a nuvem (se a pasta for local). Convive com o
   backup manual e com o window.storage do artifact — nao substitui nenhum. So funciona em
   navegadores Chromium (Chrome/Edge), por isso ha deteccao e degradacao graciosa. */

function idbOpen(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(FS_IDB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(FS_IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbHandleGet(){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var r = db.transaction(FS_IDB_STORE, 'readonly').objectStore(FS_IDB_STORE).get(FS_HANDLE_KEY);
      r.onsuccess = function(){ resolve(r.result || null); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}
function idbHandleSet(handle){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var r = db.transaction(FS_IDB_STORE, 'readwrite').objectStore(FS_IDB_STORE).put(handle, FS_HANDLE_KEY);
      r.onsuccess = function(){ resolve(); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}
function idbHandleClear(){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var r = db.transaction(FS_IDB_STORE, 'readwrite').objectStore(FS_IDB_STORE).delete(FS_HANDLE_KEY);
      r.onsuccess = function(){ resolve(); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}

function fsVerifyPermission(handle){
  if(!handle.queryPermission) return Promise.resolve(true);
  var opts = {mode:'readwrite'};
  return handle.queryPermission(opts).then(function(p){
    if(p==='granted') return true;
    return handle.requestPermission(opts).then(function(p2){ return p2==='granted'; });
  });
}
function fsQueryGranted(handle){
  if(!handle.queryPermission) return Promise.resolve(false);
  return handle.queryPermission({mode:'readwrite'}).then(function(p){ return p==='granted'; }).catch(function(){ return false; });
}
function fsWriteFileHandle(fh, text){
  return fh.createWritable().then(function(w){
    return Promise.resolve(w.write(text)).then(function(){ return w.close(); });
  });
}

/* Le o arquivo de dados de dentro da pasta conectada. Aplica em `state` e retorna:
   'loaded' (carregou dados validos), 'new' (pasta ainda sem arquivo de dados) ou
   'invalid' (arquivo existe mas nao e um JSON valido desta ferramenta — nao mexe em state). */
function loadFromDir(handle){
  return handle.getFileHandle(FS_DATA_FILE, {create:false}).then(function(fh){
    return fh.getFile().then(function(f){ return f.text(); }).then(function(text){
      if(!text || !text.trim()) return 'new';
      var imported = null;
      try{ imported = JSON.parse(text); }catch(e){ return 'invalid'; }
      if(imported && Array.isArray(imported.protocolos)){ state = migrate(imported); holidayCache = {}; return 'loaded'; }
      return 'invalid';
    });
  }).catch(function(){ return 'new'; });
}

/* Grava o estado no arquivo de dados dentro da pasta, coalescendo gravacoes sobrepostas:
   varias acoes rapidas nao devem abrir writables concorrentes, e a ultima gravacao sempre
   reflete o estado atual. */
function fsFlush(){
  if(!dirHandle) return Promise.resolve();
  if(fsWriting){ fsPending = true; return Promise.resolve(); }
  fsWriting = true;
  return dirHandle.getFileHandle(FS_DATA_FILE, {create:true}).then(function(fh){
    return fsWriteFileHandle(fh, JSON.stringify(state));
  }).then(function(){
    fsWriting = false;
    if(fsPending){ fsPending = false; return fsFlush(); }
  }).catch(function(e){
    fsWriting = false;
    console.error('Falha ao salvar na pasta', e);
    fsStatus = 'error';
    App.render();
  });
}

/* ---- Backups automaticos locais: copias datadas 2x/dia dentro da subpasta backups/ ---- */
function collectDirEntries(dirH){
  var it = dirH.values();
  var acc = [];
  function step(){
    return it.next().then(function(res){
      if(res.done) return acc;
      acc.push(res.value);
      return step();
    });
  }
  return step();
}
function pruneBackups(bdir){
  return collectDirEntries(bdir).then(function(entries){
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - FS_BACKUP_RETENTION_DIAS);
    var cutoffISO = toISO(cutoff);
    var dels = [];
    entries.forEach(function(h){
      if(h.kind !== 'file') return;
      var m = /(\d{4}-\d{2}-\d{2})_\d{4}\.json$/.exec(h.name);
      if(m && m[1] < cutoffISO) dels.push(h.name);
    });
    return dels.reduce(function(p, name){
      return p.then(function(){ return bdir.removeEntry(name).catch(function(){}); });
    }, Promise.resolve());
  });
}
function writeBackupSnapshot(slot){
  if(!dirHandle) return Promise.resolve(false);
  var fname = 'controle-atos-dados-' + todayISO() + '_' + slot.replace(':', '') + '.json';
  return dirHandle.getDirectoryHandle(FS_BACKUP_DIR, {create:true}).then(function(bdir){
    return bdir.getFileHandle(fname, {create:true}).then(function(fh){
      return fsWriteFileHandle(fh, JSON.stringify(state));
    }).then(function(){ return pruneBackups(bdir); });
  }).then(function(){ return true; }).catch(function(e){
    console.error('Falha no backup automatico', e); return false;
  });
}
/* Enquanto o app esta aberto (e na abertura), verifica se algum horario de backup ja
   passou hoje e ainda nao foi feito — se sim, faz a copia. "Recuperacao na proxima
   abertura": se o app estava fechado no horario, a copia sai assim que ele abrir depois,
   no mesmo dia. Os marcadores de "ja fiz hoje" ficam no localStorage (por maquina). */
function checkScheduledBackups(){
  if(!fileMode || !dirHandle || backupRunning) return;
  var now = new Date();
  var today = toISO(now);
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var due = null;
  for(var i=0;i<FS_BACKUP_SLOTS.length;i++){
    var slot = FS_BACKUP_SLOTS[i];
    var parts = slot.split(':');
    var slotMin = parseInt(parts[0],10) * 60 + parseInt(parts[1],10);
    var key = 'cartorio-backup-' + slot.replace(':','');
    var last = null;
    try{ last = window.localStorage.getItem(key); }catch(e){}
    if(nowMin >= slotMin && last !== today){ due = {slot:slot, key:key}; break; }
  }
  if(!due) return;
  backupRunning = true;
  writeBackupSnapshot(due.slot).then(function(ok){
    if(ok){ try{ window.localStorage.setItem(due.key, today); }catch(e){} }
    backupRunning = false;
    if(settingsOpen) App.render();
  }).catch(function(){ backupRunning = false; });
}

/* ===================== Utilidades de data ===================== */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayISO(){ return toISO(new Date()); }
function parseISODate(iso){
  var parts = iso.split('-');
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}
function formatBR(iso){
  if(!iso) return '';
  var p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function sameDay(ts, iso){ return toISO(new Date(ts))===iso; }

function getEaster(year){
  var a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4,
      f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
      month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
function addDays(date, n){ var d=new Date(date); d.setDate(d.getDate()+n); return d; }

var holidayCache = {};
function getHolidaySetForYear(year){
  var cacheKey = year+'|'+JSON.stringify(state.feriadosMoveis);
  if(holidayCache[cacheKey]) return holidayCache[cacheKey];
  var set = {};
  set[year+'-01-01']=1;
  set[year+'-04-21']=1;
  set[year+'-05-01']=1;
  set[year+'-09-07']=1;
  set[year+'-10-12']=1;
  set[year+'-11-02']=1;
  set[year+'-11-15']=1;
  if(year>=2024) set[year+'-11-20']=1;
  set[year+'-12-25']=1;
  var easter = getEaster(year);
  if(state.feriadosMoveis.sextaSanta) set[toISO(addDays(easter,-2))]=1;
  if(state.feriadosMoveis.carnaval) set[toISO(addDays(easter,-47))]=1;
  if(state.feriadosMoveis.corpusChristi) set[toISO(addDays(easter,60))]=1;
  holidayCache[cacheKey]=set;
  return set;
}
function isHoliday(iso){
  var year = parseInt(iso.split('-')[0],10);
  var set = getHolidaySetForYear(year);
  if(set[iso]) return true;
  for(var i=0;i<state.feriadosExtras.length;i++){
    if(state.feriadosExtras[i].date===iso) return true;
  }
  return false;
}
function isBusinessDay(iso){
  var d = parseISODate(iso);
  var dow = d.getDay();
  return dow!==0 && dow!==6 && !isHoliday(iso);
}
function addBusinessDays(startISO, n){
  var d = parseISODate(startISO);
  var count=0;
  while(count<n){
    d = addDays(d,1);
    var iso = toISO(d);
    if(isBusinessDay(iso)) count++;
  }
  return toISO(d);
}
function businessDaysBetween(startISO, endISO){
  if(endISO<=startISO) return 0;
  var d = parseISODate(startISO);
  var end = parseISODate(endISO);
  var count=0;
  while(d<end){
    d = addDays(d,1);
    if(isBusinessDay(toISO(d))) count++;
  }
  return count;
}

function getStatusMap(){
  var m={};
  state.statusList.forEach(function(s){ m[s.key]=s; });
  return m;
}
function getTiposOrdenadosPorUso(){
  var lastUsed = {};
  state.protocolos.forEach(function(p){
    var ts = p.createdAt || 0;
    (p.tipos||[]).forEach(function(t){
      if(!lastUsed[t] || ts>lastUsed[t]) lastUsed[t]=ts;
    });
  });
  return state.tiposAtos.slice().sort(function(a,b){
    var ta = lastUsed[a]||0, tb = lastUsed[b]||0;
    return tb-ta;
  });
}
function getStatusOf(p){
  return getStatusMap()[p.status] || {key:p.status, label:p.status||'Status desconhecido', cor:'gray', isFinal:false, requerDigitalizacao:false};
}
function isArquivado(p){
  var st = getStatusOf(p);
  if(!st.isFinal) return false;
  if(st.requerDigitalizacao) return !!p.rascunhoDigitalizado;
  return true;
}
function needsDigitalizacaoGate(p){
  var st = getStatusOf(p);
  return !!(st.isFinal && st.requerDigitalizacao && !p.rascunhoDigitalizado);
}
function getVinculados(p){
  if(!p.grupoVinculoId) return [];
  return state.protocolos.filter(function(x){ return x.grupoVinculoId===p.grupoVinculoId && x.id!==p.id && !x.naLixeira; });
}

function computePrazo(p){
  if(!p.dataRecebimentoCompleto) return null;
  if(getStatusOf(p).isFinal) return null;
  var deadline = addBusinessDays(p.dataRecebimentoCompleto, PRAZO_DIAS_UTEIS);
  var today = todayISO();
  var elapsed = businessDaysBetween(p.dataRecebimentoCompleto, today);
  var elapsedCapped = Math.min(elapsed, PRAZO_DIAS_UTEIS);
  var isOverdue = today>deadline;
  var isDueToday = today===deadline;
  var diasAtraso = isOverdue ? businessDaysBetween(deadline, today) : 0;
  return {deadline:deadline, elapsedCapped:elapsedCapped, isOverdue:isOverdue, isDueToday:isDueToday, diasAtraso:diasAtraso};
}

/* ===================== Helpers ===================== */
function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function jsAttr(s){
  var v = String(s==null?'':s);
  v = v.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
  v = v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  return v;
}
function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
/* Mesma logica de merge de grupoVinculoId usada em App.saveProtocolo, extraida para uso
   fora do formulario (painel de vinculo dedicado — 5b), onde o protocolo de origem ja
   existe em state.protocolos. Nao reaproveitada DENTRO de saveProtocolo para nao mexer
   num fluxo ja testado (la o payload ainda nao esta no array no momento do merge). */
function applyVinculoManual(protocoloId, selectedIdsRaw){
  var original = state.protocolos.filter(function(p){ return p.id===protocoloId; })[0];
  if(!original) return;
  var selectedVinculoIds = selectedIdsRaw.filter(function(vid){ return vid!==protocoloId; });
  var previousGroupId = original.grupoVinculoId;
  var previousMemberIds = previousGroupId ? state.protocolos.filter(function(p){ return p.grupoVinculoId===previousGroupId && p.id!==protocoloId; }).map(function(p){return p.id;}) : [];
  var removedIds = previousMemberIds.filter(function(id){ return selectedVinculoIds.indexOf(id)===-1; });
  var candidateGroupIds = [];
  var finalGroupId = null;

  if(selectedVinculoIds.length){
    var keepsAnOriginalMember = previousGroupId && selectedVinculoIds.some(function(id){ return previousMemberIds.indexOf(id)!==-1; });
    if(keepsAnOriginalMember) candidateGroupIds.push(previousGroupId);
    selectedVinculoIds.forEach(function(vid){
      var vp = state.protocolos.filter(function(p){ return p.id===vid; })[0];
      if(vp && vp.grupoVinculoId && candidateGroupIds.indexOf(vp.grupoVinculoId)===-1) candidateGroupIds.push(vp.grupoVinculoId);
    });
    finalGroupId = candidateGroupIds.length ? candidateGroupIds[0] : uid();
  }

  state.protocolos = state.protocolos.map(function(p){
    if(p.id===protocoloId){ p.grupoVinculoId = finalGroupId; return p; }
    if(finalGroupId && selectedVinculoIds.indexOf(p.id)!==-1){ p.grupoVinculoId = finalGroupId; return p; }
    if(finalGroupId && candidateGroupIds.length>1 && candidateGroupIds.indexOf(p.grupoVinculoId)!==-1){ p.grupoVinculoId = finalGroupId; return p; }
    if(removedIds.indexOf(p.id)!==-1){ p.grupoVinculoId = null; return p; }
    return p;
  });
}
function removeAccents(str){ return str.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function slugify(str){
  return removeAccents(str).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'status';
}

/* Containers com rolagem propria que sobrevivem (por seletor, nao por referencia —
   o no antigo e destruido no re-render) a uma passada de renderAll(): o modal antigo
   (Configuracoes/Historico do cliente/Relatorio do dia), o corpo do painel lateral e
   as duas colunas da edicao em grade. So existe no maximo um de cada por vez. */
var SCROLL_CONTAINER_SELECTORS = ['.overlay', '.side-panel-body', '.fm-edit-col-left', '.fm-edit-col-right'];
function withFocus(fn){
  var active = document.activeElement;
  var id = active && active.id;
  var start = (active && typeof active.selectionStart==='number') ? active.selectionStart : null;
  var end = (active && typeof active.selectionEnd==='number') ? active.selectionEnd : null;
  var winScrollY = window.scrollY;
  var scrollPositions = SCROLL_CONTAINER_SELECTORS.map(function(sel){
    var el = document.querySelector(sel);
    return el ? el.scrollTop : null;
  });
  fn();
  if(id){
    var el = document.getElementById(id);
    if(el){
      el.focus();
      if(start!=null && el.setSelectionRange){ try{ el.setSelectionRange(start,end); }catch(e){} }
    }
  }
  SCROLL_CONTAINER_SELECTORS.forEach(function(sel, i){
    if(scrollPositions[i]==null) return;
    var el = document.querySelector(sel);
    if(el) el.scrollTop = scrollPositions[i];
  });
  window.scrollTo(0, winScrollY);
}

/* Toast de feedback (fora do #app, sobrevive ao re-render). undoFn opcional vira "Desfazer". */
App.showToast = function(msg, undoFn){
  var layer = document.getElementById('toast-layer');
  if(!layer) return;
  var toast = document.createElement('div');
  toast.className = 'toast';
  var span = document.createElement('span');
  span.innerHTML = msg;
  toast.appendChild(span);
  var timer;
  function dismiss(){
    if(timer){ clearTimeout(timer); timer=null; }
    if(toast.parentNode){
      toast.classList.add('toast-out');
      setTimeout(function(){ if(toast.parentNode) toast.parentNode.removeChild(toast); }, 220);
    }
  }
  if(typeof undoFn === 'function'){
    var btn = document.createElement('button');
    btn.className = 'toast-undo';
    btn.textContent = 'Desfazer';
    btn.onclick = function(){ dismiss(); undoFn(); };
    toast.appendChild(btn);
  }
  layer.appendChild(toast);
  timer = setTimeout(dismiss, 5000);
};

/* "Promover" um extra ad-hoc pra virar documento padrao do tipo escolhido: some em
   state.checklistPorTipo (passa a valer pra todo protocolo futuro/existente desse
   tipo) e sai de documentosExtras deste protocolo especifico (senao apareceria
   duplicado - um vindo do tipo, outro do extra). Marcacao (documentosMarcados) nao
   e tocada, entao nada que ja foi marcado como recebido se perde. */
App.promoverDocumentoExtra = function(id, doc, tipoAlvo){
  if(!tipoAlvo) return;
  if(!state.checklistPorTipo[tipoAlvo]) state.checklistPorTipo[tipoAlvo] = [];
  if(state.checklistPorTipo[tipoAlvo].indexOf(doc)===-1) state.checklistPorTipo[tipoAlvo].push(doc);
  state.protocolos = state.protocolos.map(function(p){
    if(p.id===id){
      p.documentosExtras = (p.documentosExtras||[]).filter(function(x){ return x!==doc; });
    }
    return p;
  });
  saveState();
  App.render();
};

function matchesFilters(p){
  if(ui.viewMode==='lixeira'){
    if(!p.naLixeira) return false;
  }else{
    if(p.naLixeira) return false;
    var archived = isArquivado(p);
    if(ui.viewMode==='arquivados'){ if(!archived) return false; }
    else{ if(archived) return false; }
    if(ui.statusFilter!=='all' && p.status!==ui.statusFilter) return false;
  }
  if(ui.canalFilter!=='all' && (p.canais||[]).indexOf(ui.canalFilter)===-1) return false;
  if(ui.pessoaFilter!=='all' && p.tipoPessoa!==ui.pessoaFilter) return false;
  if(ui.onlyOverdue){
    var info = computePrazo(p);
    if(!info || !info.isOverdue) return false;
  }
  if(ui.onlyDueToday){
    var infoDue = computePrazo(p);
    if(!infoDue || !infoDue.isDueToday) return false;
  }
  if(ui.onlyPendingDocs && p.docsCompletos) return false;
  if(ui.search){
    var q = ui.search.toLowerCase();
    var hay = (p.cliente+' '+p.numeroProtocolo+' '+p.tipos.join(' ')+' '+p.outorgados+' '+p.responsavel+' '+p.clienteTelefone+' '+p.clienteEmail).toLowerCase();
    if(hay.indexOf(q)===-1) return false;
  }
  return true;
}
function sortComparator(a,b){
  if(ui.viewMode==='lixeira'){
    return (b.dataExclusao||0) - (a.dataExclusao||0);
  }
  var ia = computePrazo(a), ib = computePrazo(b);
  var overdueA = ia && ia.isOverdue ? 0 : 1;
  var overdueB = ib && ib.isOverdue ? 0 : 1;
  if(overdueA!==overdueB) return overdueA-overdueB;
  if(ui.sortBy==='data'){
    return b.dataProtocolo<a.dataProtocolo ? -1 : (b.dataProtocolo>a.dataProtocolo?1:0);
  }
  var ka = ia ? ia.deadline : '9999-99-99';
  var kb = ib ? ib.deadline : '9999-99-99';
  if(ka===kb) return b.dataProtocolo<a.dataProtocolo?-1:1;
  return ka<kb ? -1 : 1;
}
function getFilteredSorted(){
  return state.protocolos.filter(matchesFilters).sort(sortComparator);
}

App.saveProtocolo = function(){
  captureModalTextFields();
  var d = draftModal;
  var tiposArr = Object.keys(d.tipos);
  var canaisArr = Object.keys(d.canais);
  var dataProtocolo = d.dataProtocolo || todayISO();
  var original = d.mode==='edit' ? state.protocolos.filter(function(p){return p.id===d.id;})[0] : null;
  var statusFinal = d.status || (state.statusList[0] && state.statusList[0].key) || '';
  var historico = original ? original.historico.slice() : [];
  if(!original || original.status!==statusFinal){
    historico.push({status:statusFinal, ts:Date.now()});
  }
  var observacoesHistorico = original ? original.observacoesHistorico.slice() : [];
  var novaObs = (d.novaObservacao||'').trim();
  if(novaObs) observacoesHistorico.push({texto:novaObs, ts:Date.now(), etiqueta:null, editadoEm:null});
  var payload = {
    id: d.id || uid(),
    numeroProtocolo:(d.numeroProtocolo||'').trim(),
    cliente:(d.cliente||'').trim(),
    clienteTelefone:(d.clienteTelefone||'').trim(),
    clienteEmail:(d.clienteEmail||'').trim(),
    outorgados:(d.outorgados||'').trim(),
    responsavel:(d.responsavel||'').trim(),
    tipoPessoa: d.tipoPessoa || 'pf',
    canais: canaisArr,
    dataProtocolo: dataProtocolo,
    docsCompletos: !!d.docsCompletos,
    dataRecebimentoCompleto: d.docsCompletos ? (d.dataRecebimentoCompleto || dataProtocolo) : (d.dataRecebimentoCompleto || null),
    status: statusFinal,
    tipos: tiposArr,
    observacoesHistorico: observacoesHistorico,
    historico: historico,
    rascunhoDigitalizado: original ? !!original.rascunhoDigitalizado : false,
    dataDigitalizacao: original ? (original.dataDigitalizacao || null) : null,
    createdAt: original ? original.createdAt : Date.now()
  };

  /* ---- Vínculo manual entre protocolos da mesma pessoa/empresa ---- */
  var selectedVinculoIds = Object.keys(d.vinculados||{}).filter(function(vid){ return vid!==payload.id; });
  var previousGroupId = original ? original.grupoVinculoId : null;
  var previousMemberIds = previousGroupId ? state.protocolos.filter(function(p){ return p.grupoVinculoId===previousGroupId && p.id!==payload.id; }).map(function(p){return p.id;}) : [];
  var removedIds = previousMemberIds.filter(function(id){ return selectedVinculoIds.indexOf(id)===-1; });

  if(selectedVinculoIds.length===0){
    payload.grupoVinculoId = null;
  }else{
    var candidateGroupIds = [];
    var keepsAnOriginalMember = previousGroupId && selectedVinculoIds.some(function(id){ return previousMemberIds.indexOf(id)!==-1; });
    if(keepsAnOriginalMember) candidateGroupIds.push(previousGroupId);
    selectedVinculoIds.forEach(function(vid){
      var vp = state.protocolos.filter(function(p){ return p.id===vid; })[0];
      if(vp && vp.grupoVinculoId && candidateGroupIds.indexOf(vp.grupoVinculoId)===-1) candidateGroupIds.push(vp.grupoVinculoId);
    });
    var finalGroupId = candidateGroupIds.length ? candidateGroupIds[0] : uid();
    payload.grupoVinculoId = finalGroupId;
    // Traz para o grupo final: quem foi selecionado, e mescla por completo qualquer grupo antigo envolvido.
    state.protocolos = state.protocolos.map(function(p){
      if(selectedVinculoIds.indexOf(p.id)!==-1) p.grupoVinculoId = finalGroupId;
      else if(candidateGroupIds.length>1 && candidateGroupIds.indexOf(p.grupoVinculoId)!==-1) p.grupoVinculoId = finalGroupId;
      return p;
    });
  }
  if(removedIds.length){
    state.protocolos = state.protocolos.map(function(p){
      if(removedIds.indexOf(p.id)!==-1) p.grupoVinculoId = null;
      return p;
    });
  }

  if(d.mode==='edit'){
    state.protocolos = state.protocolos.map(function(p){ return p.id===payload.id ? payload : p; });
  }else{
    state.protocolos.push(payload);
    justCreatedId = payload.id;
  }
  if(payload.responsavel) state.ultimoResponsavel = payload.responsavel;
  saveState();
  draftModal=null; draftModalSnapshot=null;
  App.render();
};

App.changeStatusQuick = function(id, newStatus){
  var prev = null;
  state.protocolos.forEach(function(p){ if(p.id===id) prev={status:p.status, histLen:(p.historico||[]).length}; });
  var changed = false;
  state.protocolos = state.protocolos.map(function(p){
    if(p.id===id && p.status!==newStatus){
      p.status=newStatus;
      p.historico = p.historico || [];
      p.historico.push({status:newStatus, ts:Date.now()});
      changed = true;
    }
    return p;
  });
  saveState();
  App.render();
  if(changed && prev){
    var statusMap = getStatusMap();
    var lbl = (statusMap[newStatus] || {label:newStatus}).label;
    App.showToast('Status alterado para &ldquo;'+esc(lbl)+'&rdquo;.', function(){
      state.protocolos = state.protocolos.map(function(p){
        if(p.id===id){
          p.status = prev.status;
          if(p.historico && p.historico.length > prev.histLen) p.historico = p.historico.slice(0, prev.histLen);
        }
        return p;
      });
      saveState();
      App.render();
    });
  }
};

  if(idx<0 || idx>=state.statusList.length-1) return;
  App.changeStatusQuick(id, state.statusList[idx+1].key);
};

function buildFichaPrintHTML(p){
  var st = getStatusOf(p);
  var canais = (p.canais||[]).map(function(c){ return (CANAL_MAP[c]||{label:c}).label; }).join(', ');
  var info = computePrazo(p);
  var prazoTxt;
  if(!p.docsCompletos || !p.dataRecebimentoCompleto) prazoTxt = 'Documentação incompleta';
  else if(!info) prazoTxt = 'Documentação completa em '+formatBR(p.dataRecebimentoCompleto);
  else if(info.isOverdue) prazoTxt = 'Atrasado há '+info.diasAtraso+' dia(s) útil(eis) — prazo era '+formatBR(info.deadline);

  }).join('');
  return '<div class="fp">'+
    '<div class="fp-eyebrow">Cartório de Notas — Controle de Atos</div>'+
    '<div class="fp-title">Ficha de Protocolo</div>'+
    '<table class="fp-table"><tbody>'+

      row('Telefone', esc(p.clienteTelefone))+

      row('Outorgado(s)', esc(p.outorgados))+
      row('Responsável', esc(p.responsavel))+
      row('Canais', esc(canais))+
      row('Tipos de ato', esc((p.tipos||[]).join(', ')))+
      row('Status', esc(st.label))+
      row('Prazo', esc(prazoTxt))+
      row('Documentação completa', p.docsCompletos ? ('Sim'+(p.dataRecebimentoCompleto?(' — '+esc(formatBR(p.dataRecebimentoCompleto))):'')) : 'Não')+
      (docs ? row('Checklist de documentos', docs) : '')+
    '</tbody></table>'+
