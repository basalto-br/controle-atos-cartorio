/* Registra um lancamento (soma positiva) na lista "lancamentos de hoje", usada para as
   pilulas "+N hh:mm" e o "desfazer ultimo". Correcoes (-1, editar total) NAO viram
   lancamento — sao formas de correcao, nao atendimentos novos. */
function registrarLancamentoBalcao(qtd){
  if(qtd<=0) return;
  var hoje = todayISO();
  if(!state.atosBalcaoLancamentos[hoje]) state.atosBalcaoLancamentos[hoje]=[];
  state.atosBalcaoLancamentos[hoje].push({qtd:qtd, ts:Date.now()});
}
App.ajustarAtoBalcao = function(delta){
  var hoje = todayISO();
  var atual = state.atosBalcao[hoje] || 0;
  state.atosBalcao[hoje] = Math.max(0, atual + delta);
  if(delta>0) registrarLancamentoBalcao(delta);
  saveState();
  App.render();
};
App.adicionarQuantidadeBalcao = function(inputId){
  var el = document.getElementById(inputId || 'qtdBalcaoInput');

  var hoje = todayISO();
  var atual = state.atosBalcao[hoje] || 0;
  state.atosBalcao[hoje] = Math.max(0, atual + n);
  if(n>0) registrarLancamentoBalcao(n);
  saveState();
  if(el) el.value='';
  App.render();
};
App.desfazerUltimoLancamentoBalcao = function(){
  var hoje = todayISO();
  var lista = state.atosBalcaoLancamentos[hoje];
  if(!lista || !lista.length) return;
  var ultimo = lista.pop();
  var atual = state.atosBalcao[hoje] || 0;
  state.atosBalcao[hoje] = Math.max(0, atual - ultimo.qtd);

};

/* ---- Exportar CSV ---- */
App.exportCSV = function(){
  var list = getFilteredSorted();
  var statusMap = getStatusMap();
  var headers = ['Nº Protocolo','Data do Protocolo','Tipo de Pessoa','Cliente/Outorgante','Telefone','E-mail','Outorgado(s)','Canais','Responsável','Documentos Completos','Data Recebimento Completo','Data do Prazo','Status','Tipos de Ato','Vinculado a','Observações (histórico)'];
  function csvField(v){
    v = (v==null?'':String(v));
    if(/["\,\n;]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function canaisLabel(p){
    return (p.canais||[]).map(function(c){ return (CANAL_MAP[c]||{label:c}).label; }).join('; ');
  }
  function vinculadosLabel(p){
    return getVinculados(p).map(function(v){ return v.numeroProtocolo || v.cliente || v.id; }).join('; ');
  }
  function obsLabel(p){
    return (p.observacoesHistorico||[]).map(function(o){
      var d = new Date(o.ts);
      return o.texto+' ['+formatBR(toISO(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes())+']';
    }).join(' | ');
  }
  var rows = [headers.map(csvField).join(',')];
  list.forEach(function(p){
    var info = computePrazo(p);
    var st = statusMap[p.status];
    rows.push([
      p.numeroProtocolo, formatBR(p.dataProtocolo), p.tipoPessoa==='pj'?'Pessoa Jurídica':'Pessoa Física',
      p.cliente, p.clienteTelefone, p.clienteEmail, p.outorgados, canaisLabel(p), p.responsavel,
      p.docsCompletos?'Sim':'Não', p.dataRecebimentoCompleto?formatBR(p.dataRecebimentoCompleto):'',
      info?formatBR(info.deadline):'',
      st?st.label:p.status, p.tipos.join('; '), vinculadosLabel(p), obsLabel(p)
    ].map(csvField).join(','));
  });
  var csvContent = '\uFEFF'+rows.join('\r\n');
  var blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'protocolos_'+todayISO()+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
};

App.importBackupFile = function(inputEl){

  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var imported;
    try{ imported = JSON.parse(e.target.result); }
    catch(err){ window.alert('Não foi possível ler este arquivo. Verifique se é um backup válido gerado por esta ferramenta.'); inputEl.value=''; return; }
    if(!imported || !Array.isArray(imported.protocolos)){
      window.alert('Este arquivo não parece ser um backup válido desta ferramenta.');
      inputEl.value='';
      return;
    }
    if(!window.confirm('Isso vai SUBSTITUIR todos os protocolos e configurações atuais pelos dados deste arquivo de backup. Esta ação não pode ser desfeita. Deseja continuar?')){
      inputEl.value='';
      return;
    }
    state = migrate(imported);
    holidayCache = {};
    saveState();
    inputEl.value='';
    App.render();
  };
  reader.readAsText(file);

/* ---- Armazenamento em pasta: conectar / reconectar / desconectar ---- */
App.conectarPastaDados = function(){
  if(!fsSupported){ window.alert('Este navegador não permite salvar em pasta local. Abra a ferramenta no Google Chrome ou no Microsoft Edge.'); return Promise.resolve(); }
  return window.showDirectoryPicker({mode:'readwrite'}).then(function(handle){
    return fsVerifyPermission(handle).then(function(ok){
      if(!ok){ window.alert('Permissão de escrita negada para a pasta.'); return; }
      return loadFromDir(handle).then(function(status){
        if(status === 'invalid'){
          window.alert('Esta pasta já contém um arquivo "'+FS_DATA_FILE+'" que não pôde ser lido. Para não sobrescrever nada, escolha outra pasta ou verifique esse arquivo.');
          return;
        }
        dirHandle = handle; fileMode = true; fsStatus = 'connected'; fsFolderName = handle.name; fsPendingHandle = null;
        var p = (status === 'new') ? fsFlush() : Promise.resolve();
        return p.then(function(){ return idbHandleSet(handle); }).then(function(){
          checkScheduledBackups();
          App.render();
        });
      });
    });
  }).catch(function(err){
    if(err && err.name==='AbortError') return;
    console.error(err); window.alert('Não foi possível conectar a pasta: '+(err && err.message ? err.message : err));
  });
};
App.reconectarPasta = function(){
  if(!fsPendingHandle) return Promise.resolve();
  var handle = fsPendingHandle;
  return fsVerifyPermission(handle).then(function(ok){
    if(!ok){ window.alert('Permissão negada para a pasta.'); return; }
    return loadFromDir(handle).then(function(status){
      if(status === 'invalid'){
        window.alert('O arquivo de dados desta pasta não pôde ser lido. Verifique o arquivo "'+FS_DATA_FILE+'" ou restaure um backup.');
        return;
      }
      dirHandle = handle; fileMode = true; fsStatus = 'connected'; fsFolderName = handle.name; fsPendingHandle = null;
      var p = (status === 'new') ? fsFlush() : Promise.resolve();
      return p.then(function(){ checkScheduledBackups(); App.render(); });
    });
  }).catch(function(err){
    console.error(err); window.alert('Não foi possível reconectar a pasta: '+(err && err.message ? err.message : err));
  });
};
App.desconectarPasta = function(){
  if(!window.confirm('Desconectar a pasta? O app volta a salvar no armazenamento padrão do navegador. Os arquivos NÃO são apagados — seus dados e backups continuam na pasta e você pode reconectar depois.')) return Promise.resolve();
  return idbHandleClear().then(function(){
    dirHandle = null; fileMode = false; fsPendingHandle = null;
    fsStatus = fsSupported ? 'offer' : 'unsupported';
    App.render();
  });
};

function renderUrgenciaAlert(){
  if(ui.viewMode==='lixeira' || ui.viewMode==='arquivados') return '';
  var ativos = state.protocolos.filter(function(p){ return !p.naLixeira && !isArquivado(p); });
  var overdue=0, dueToday=0;
  ativos.forEach(function(p){
    var info = computePrazo(p);
    if(info){ if(info.isOverdue) overdue++; else if(info.isDueToday) dueToday++; }
  });
  if(!overdue && !dueToday) return '';
  var parts = [];
  if(overdue) parts.push('<strong>'+overdue+'</strong> atrasado'+(overdue>1?'s':''));
  if(dueToday) parts.push('<strong>'+dueToday+'</strong> vence'+(dueToday>1?'m':'')+' hoje');
  var target = overdue ? "App.toggleQuick('overdue')" : "App.toggleQuick('today')";
  return '<div class="banner-alert no-print" onclick="'+target+'">&#9888; '+parts.join(' &middot; ')+' &mdash; clique para ver</div>';
}

function renderStats(){
  var all = state.protocolos.filter(function(p){ return !p.naLixeira; });
  var ativos = all.filter(function(p){ return !isArquivado(p); });
  var overdue=0, dueToday=0;
  ativos.forEach(function(p){
    var info = computePrazo(p);
    if(info){ if(info.isOverdue) overdue++; else if(info.isDueToday) dueToday++; }
  });
  var arquivados = all.filter(isArquivado).length;
  var isLista = ui.viewMode==='lista';
  var noQuick = !ui.onlyOverdue && !ui.onlyDueToday && !ui.onlyPendingDocs;
  function item(num, lbl, o){
    o = o || {};
    var cls = 'regua-item'+(o.warn?' warn':'')+(o.late?' late':'')+(o.on?' on':'');
    return '<div class="'+cls+'" onclick="'+o.onclick+'" title="'+esc(o.title||'')+'"><span class="rn">'+num+'</span><span class="rl">'+lbl+'</span></div>';
  }
  return '<div class="regua no-print">'+
    item(ativos.length,'ativos',{onclick:"App.filtroAtivos()", on:isLista&&noQuick&&ui.statusFilter==='all', title:'Ver todos os ativos'})+
    item(dueToday,'vencem hoje',{warn:dueToday>0, onclick:"App.toggleQuick('today')", on:isLista&&ui.onlyDueToday, title:'Filtrar os que vencem hoje'})+
    item(overdue,'atrasados',{late:overdue>0, onclick:"App.toggleQuick('overdue')", on:isLista&&ui.onlyOverdue, title:'Filtrar os atrasados'})+
    item(arquivados,'arquivados',{onclick:"App.setViewMode('arquivados')", on:ui.viewMode==='arquivados', title:'Ver arquivados'})+
  '</div>';
}

function renderDots(info){
  var html = '<div class="dots">';
  for(var i=1;i<=PRAZO_DIAS_UTEIS;i++){
    var filled = info && i<=info.elapsedCapped;
    html += '<div class="dot'+(filled?' filled'+(info.isOverdue?' late':''):'')+'"></div>';
  }
  html += '</div>';
  return html;
}

function renderFichaPrazo(p){
  if(!p.docsCompletos || !p.dataRecebimentoCompleto){
    var isOpen = App.docInlineOpen[p.id];
    return '<div class="docs-pending">'+
      '<span>Documentação incompleta desde o protocolo.</span>'+
      (isOpen ?
        '<input type="date" id="docdate_'+p.id+'" class="'+(justOpenedKey==='docdate:'+p.id?'anim-in':'')+'" value="'+esc(todayISO())+'" style="font-family:var(--font-mono);font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:3px;">'+
        '<button class="btn-ghost outlined" onclick="App.markDocsComplete(\''+p.id+'\')">Confirmar recebimento</button>'
        :
        '<button class="btn-ghost" onclick="App.showDocDateField(\''+p.id+'\')">Marcar documentação completa</button>'
      )+
    '</div><div></div>';
  }
  var info = computePrazo(p);
  if(!info){
    return '<div class="docs-pending"><span>Documentação completa em '+esc(formatBR(p.dataRecebimentoCompleto))+'.</span></div><div></div>';
  }
  var cls = info.isOverdue ? 'late' : (info.isDueToday ? 'warn' : 'ok');
  var text;
  if(info.isOverdue){
    text = 'Atrasado há '+info.diasAtraso+' dia(s) útil(eis) — prazo era '+formatBR(info.deadline);
  }else if(info.isDueToday){
    text = 'Vence hoje ('+formatBR(info.deadline)+')';
  }else{
    text = 'Faltam '+(PRAZO_DIAS_UTEIS-info.elapsedCapped)+' dia(s) útil(eis) — prazo '+formatBR(info.deadline);
  }
  return '<div class="prazo-info"><span class="prazo-text '+cls+'">'+esc(text)+'</span>'+renderDots(info)+'</div>';
}

function renderHistorico(p){
  var isOpen = historicoAbertos[p.id];
  var statusMap = getStatusMap();
  var toggle = '<button class="hist-toggle" onclick="App.toggleHistorico(\''+p.id+'\')">'+(isOpen?'Ocultar histórico':'Ver histórico (' + p.historico.length + ')')+'</button>';
  if(!isOpen) return toggle;
  var rows = p.historico.map(function(h,idx){
    var st = statusMap[h.status] || {label:h.status};
    var d = new Date(h.ts);
    var dstr = pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    var dur = '';
    var endTs = (idx+1<p.historico.length) ? p.historico[idx+1].ts : Date.now();
    var diasCorridos = Math.max(0, Math.round((endTs-h.ts)/86400000));
    dur = (idx+1<p.historico.length) ? (diasCorridos+' dia(s) nesta fase') : (diasCorridos+' dia(s) até agora');
    return '<div class="hist-row"><span>'+esc(st.label)+'</span><span class="hd">'+esc(dstr)+' — '+dur+'</span></div>';
  }).reverse().join('');
  return toggle+'<div class="hist-box'+(justOpenedKey==='hist:'+p.id?' anim-in':'')+'">'+rows+'</div>';
}

/* Reordena a lista ja ordenada para que membros do mesmo grupoVinculoId fiquem
   adjacentes (na posicao do primeiro membro encontrado), sem mudar a ordem entre
   grupos/itens soltos. So altera a APRESENTACAO — nao mexe em dados. */
function regroupByVinculo(list){
  var seen = {};
  var out = [];
  list.forEach(function(p){
    if(seen[p.id]) return;
    out.push(p);
    seen[p.id] = true;
    if(p.grupoVinculoId){
      list.forEach(function(m){
        if(m.id!==p.id && !seen[m.id] && m.grupoVinculoId===p.grupoVinculoId){
          out.push(m);
          seen[m.id] = true;
        }
      });
    }
  });
  return out;
}
function renderGrupoVinculado(items){
  var head = items[0];
  var nome = head.cliente ? esc(head.cliente) : '<span style="color:var(--apagado);font-style:italic;">Sem identificação</span>';
  var seloHtml = '<span class="selo '+(head.tipoPessoa==='pj'?'pj':'pf')+'">'+(head.tipoPessoa==='pj'?'PJ':'PF')+'</span>';
  var pillHtml = '<span class="pill-vinculo">vinculado &middot; '+items.length+'</span>';
  var fichasHtml = items.map(function(p){ return renderFicha(p, true); }).join('');
  return ''+
  '<div class="grp-wrap">'+
    '<div class="grp-head">'+
      '<span class="grp-nome">'+nome+'</span>'+seloHtml+pillHtml+
      '<div style="flex:1"></div>'+
      '<button type="button" class="grp-link" onclick="App.abrirDiariosLadoALado(\''+head.grupoVinculoId+'\')">ver diários lado a lado</button>'+
      '<button type="button" class="grp-link danger" onclick="App.desvincularGrupo(\''+head.grupoVinculoId+'\')">desvincular</button>'+
    '</div>'+
    '<div class="grp-grid">'+
      '<div class="grp-chave"><span class="grp-fio"></span><span class="grp-disco">'+items.length+'</span></div>'+
      '<div class="grp-fichas">'+fichasHtml+'</div>'+
    '</div>'+
  '</div>';
}
function renderListaComVinculo(list){
  var grouped = regroupByVinculo(list);
  var html = '';
  var i = 0;
  while(i < grouped.length){
    var p = grouped[i];
    if(p.grupoVinculoId){
      var items = [p];
      var j = i+1;
      while(j < grouped.length && grouped[j].grupoVinculoId===p.grupoVinculoId){ items.push(grouped[j]); j++; }
      /* So mostra a chave/cabecalho de grupo quando 2+ membros estao na lista atual
         (filtros/busca podem deixar so 1 visivel — nesse caso e so uma ficha comum). */
      html += items.length>1 ? renderGrupoVinculado(items) : renderFicha(items[0]);
      i = j;
    }else{
      html += renderFicha(p);
      i++;
    }
  }
  return html;
}

      return '<div class="diario-entry"><div class="diario-ts">'+esc(dstr)+'</div><div class="diario-txt">'+esc(o.texto)+'</div></div>';

  return ''+

    '<span class="diarios-nome">'+nome+'</span>'+

    '<div style="flex:1"></div>'+

function computeSugestoesVinculoPanel(p){
  if(!p.cliente || !p.cliente.trim()) return [];
  var nomeNorm = p.cliente.trim().toLowerCase();
  return state.protocolos.filter(function(x){
    return x.id!==p.id && !x.naLixeira && (x.cliente||'').trim().toLowerCase()===nomeNorm && !state.sugestoesDispensadas[chaveDispensaVinculo(p.id, x.id)];
  });
}
function computeBuscaVinculoPanel(p, query){
  var q = query.trim().toLowerCase();
  if(!q) return [];
  return state.protocolos.filter(function(x){
    if(x.id===p.id || x.naLixeira) return false;
    var hay = ((x.cliente||'')+' '+(x.numeroProtocolo||'')).toLowerCase();
    return hay.indexOf(q)!==-1;
  }).slice(0,10);
}

function renderPainelVinculo(){
  var p = state.protocolos.filter(function(x){ return x.id===vinculoPanelFor; })[0];
  if(!p) return '';
  /* Membros JA vinculados (antes de qualquer alteracao nesta sessao do painel) tem
     sua propria secao, sempre visivel — sem isso, um membro do grupo que nao
     compartilha o nome (e por isso nao aparece em "sugestoes") ficaria contando no
     total de selecionados sem nenhuma linha visivel pra explicar quem e. */
  var jaVinculados = getVinculados(p);
  var jaVinculadosIds = {};
  jaVinculados.forEach(function(v){ jaVinculadosIds[v.id]=true; });

  var sugestoes = computeSugestoesVinculoPanel(p).filter(function(x){ return !jaVinculadosIds[x.id]; });
  var sugestoesIds = {};
  sugestoes.forEach(function(s){ sugestoesIds[s.id]=true; });
  var q = vinculoPanelSearch.trim();
  var buscaResultados = q ? computeBuscaVinculoPanel(p, q).filter(function(x){ return !sugestoesIds[x.id] && !jaVinculadosIds[x.id]; }) : [];

  var jaVinculadosHtml = jaVinculados.map(function(x){ return renderLinhaVinculoPanel(x, null); }).join('');
  var sugestoesHtml = sugestoes.map(function(x){ return renderLinhaVinculoPanel(x, 'nome idêntico'); }).join('');
  var buscaHtml = buscaResultados.length
    ? buscaResultados.map(function(x){ return renderLinhaVinculoPanel(x, null); }).join('')
    : (q ? '<div class="fm-hint">Nenhum protocolo encontrado.</div>' : '');

  var qtdSelecionados = Object.keys(vinculoPanelSelected).length;

  return ''+
  '<div class="side-overlay'+(modalJustOpened?' entering':'')+'" onclick="if(event.target===this) App.fecharPainelVinculo()">'+
    '<div class="side-panel w-520'+(modalJustOpened?' entering':'')+'">'+
      '<div class="side-panel-head">'+
        '<div class="fm-label" style="margin-bottom:3px;">'+(p.numeroProtocolo?('nº '+esc(p.numeroProtocolo)+' · '):'')+esc(p.cliente||'Sem identificação')+'</div>'+
        '<h2 style="margin:0;">Vincular protocolos</h2>'+
        '<div class="fm-hint" style="margin-top:5px;">O vínculo é só para ver junto — não altera status, prazo nem numeração de nenhum protocolo.</div>'+
      '</div>'+
      '<div class="side-panel-body">'+
        '<div class="vp-search-wrap">'+
          '<span class="search-icon">&#8981;</span>'+
          '<input type="text" class="fm-input" style="padding-left:30px;" placeholder="Buscar por nome ou nº de protocolo…" value="'+esc(vinculoPanelSearch)+'" oninput="App.setVinculoPanelSearch(this.value)">'+
        '</div>'+
        (jaVinculados.length ? (
          '<div style="margin-top:16px;">'+
            '<div class="vp-sec-head"><span class="fm-sec-label">Já vinculados</span></div>'+
            '<div style="display:flex;flex-direction:column;gap:8px;">'+jaVinculadosHtml+'</div>'+
          '</div>'
        ) : '')+
        (sugestoes.length ? (
          '<div style="margin-top:16px;">'+
            '<div class="vp-sec-head"><span class="fm-sec-label">Sugestões pelo nome</span><span class="vp-sec-hint">'+sugestoes.length+' encontrada'+(sugestoes.length>1?'s':'')+' &middot; nada é vinculado automaticamente</span></div>'+
            '<div style="display:flex;flex-direction:column;gap:8px;">'+sugestoesHtml+'</div>'+
          '</div>'
        ) : '')+
        (q ? (
          '<div style="margin-top:16px;">'+
            '<div class="vp-sec-head"><span class="fm-sec-label">Resultados da busca</span></div>'+
            '<div style="display:flex;flex-direction:column;gap:8px;">'+buscaHtml+'</div>'+
          '</div>'
        ) : '')+
        '<div class="vp-nota">Dispensar uma sugestão só esconde aquele par — o protocolo continua na lista normalmente e pode ser vinculado depois pela busca.</div>'+
      '</div>'+
      '<div class="side-panel-foot">'+
        '<span class="side-esc-hint">'+qtdSelecionados+' selecionado'+(qtdSelecionados===1?'':'s')+'</span>'+
        '<div style="flex:1"></div>'+

          '<button class="btn btn-primary" onclick="App.confirmarVinculoPainel()">Vincular</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  var sugestoes = state.protocolos.filter(function(p){

    var st = statusMap[p.status] || {label:p.status||''};

function telWhatsAppHref(tel){
  var digits = String(tel||'').replace(/\D/g,'');
  if(!digits) return '#';
  if(digits.length<=11) digits = '55'+digits;
  return 'https://wa.me/'+digits;
}

/* ---- Secao 4 (edicao) em modo leitura: reusa computePrazo/renderTrilha ja usados na ficha.
   Marcar/desmarcar documentacao completa continua sendo feito pela ficha, nao pelo painel. ---- */
function renderPrazoLeituraHtml(original){
  if(!original.docsCompletos || !original.dataRecebimentoCompleto){
    return '<div class="fm-hint">Documentação incompleta — marque pela ficha, na lista, para iniciar a contagem do prazo.</div>';
  }
  var info = computePrazo(original);
  if(!info){
    return '<div class="fm-prazo-box"><div class="fm-prazo-toggle-wrap">'+
      '<span class="fm-toggle-lg on" style="cursor:default;"><span class="knob"></span></span>'+
      '<span class="fm-prazo-toggle-lbl">Documentação completa</span>'+
    '</div>'+
    '<div><div class="fm-prazo-sub">recebida em</div><div style="margin-top:4px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink);">'+esc(formatBR(original.dataRecebimentoCompleto))+'</div></div>'+
    '</div><div class="fm-hint">Esta fase não conta mais prazo.</div>';
  }
  var cor = info.isOverdue ? 'var(--carimbo)' : (info.isDueToday ? 'var(--gold)' : 'var(--green)');
  var vencTxt = info.isOverdue ? ('atrasado há '+info.diasAtraso+'d') : (info.isDueToday ? ('hoje, '+formatBR(info.deadline).slice(0,5)) : formatBR(info.deadline));
  return ''+
  '<div class="fm-prazo-box">'+
    '<div class="fm-prazo-toggle-wrap">'+
      '<span class="fm-toggle-lg on" style="cursor:default;"><span class="knob"></span></span>'+
      '<span class="fm-prazo-toggle-lbl">Documentação completa</span>'+
    '</div>'+
    '<div><div class="fm-prazo-sub">recebida em</div><div style="margin-top:4px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink);">'+esc(formatBR(original.dataRecebimentoCompleto))+'</div></div>'+
    '<div class="fm-prazo-divisor"><div class="fm-prazo-sub">prazo</div>'+renderTrilha(info, cor)+'</div>'+
    '<div><div class="fm-prazo-sub">vence</div><div class="fm-prazo-venc" style="color:'+cor+';">'+esc(vencTxt)+'</div></div>'+
  '</div>'+
  '<div class="fm-hint">Para reabrir a contagem ou corrigir a data, use a ficha na lista.</div>';
}

/* ---- Relatório do dia ---- */
function computeDailyReport(){
  var today = todayISO();
  var novos=[], venceHoje=[], atrasados=[], aguardDocs=[], arquivadosHoje=[];
  state.protocolos.forEach(function(p){
    if(p.naLixeira) return;
    var st = getStatusOf(p);
    if(p.dataProtocolo===today) novos.push(p);
    if(!isArquivado(p) && !p.docsCompletos) aguardDocs.push(p);
    var info = computePrazo(p);
    if(info){
      if(info.isOverdue) atrasados.push(p);
      else if(info.isDueToday) venceHoje.push(p);
    }
    if(isArquivado(p)){
      if(st.requerDigitalizacao){
        if(p.dataDigitalizacao===today) arquivadosHoje.push(p);
      }else if(p.historico && p.historico.length){
        var last = p.historico[p.historico.length-1];
        if(last.status===p.status && sameDay(last.ts, today)) arquivadosHoje.push(p);
      }
    }
  });
  return {novos:novos, venceHoje:venceHoje, atrasados:atrasados, aguardDocs:aguardDocs, finalizadosHoje:arquivadosHoje};
}

/* ---- Agregacoes para os graficos de atos de balcao ---- */
function computeSemanaBalcao(){
  var hoje = new Date();
  var domingo = addDays(hoje, -hoje.getDay());
  var dias = [];
  var max = 0;
  for(var i=0;i<7;i++){
    var iso = toISO(addDays(domingo, i));
    var qtd = state.atosBalcao[iso] || 0;
    if(qtd>max) max = qtd;
    dias.push({iso:iso, qtd:qtd, isHoje: iso===todayISO()});
  }
  return {dias:dias, max:max, total: dias.reduce(function(s,d){ return s+d.qtd; }, 0)};
}
function computeMesBalcaoPorSemana(){
  var hoje = new Date();
  var ano = hoje.getFullYear(), mes = hoje.getMonth();
  var ultimoDia = new Date(ano, mes+1, 0).getDate();
  var semanas = [];
  var max = 0;
  for(var inicio=1; inicio<=ultimoDia; inicio+=7){
    var fim = Math.min(inicio+6, ultimoDia);
    var total = 0;
    for(var dia=inicio; dia<=fim; dia++){
      total += state.atosBalcao[ano+'-'+pad(mes+1)+'-'+pad(dia)] || 0;
    }
    if(total>max) max = total;
    semanas.push({faixa: inicio+'-'+fim, qtd: total});
  }
  return {semanas:semanas, max:max, total: semanas.reduce(function(s,w){ return s+w.qtd; }, 0)};
}

/* ===================== Início ===================== */
function fallbackLoad(){
  return loadState().then(function(s){ state = s; renderAll(); });
}
function bootstrap(){
  if(!fsSupported){
    fsStatus = 'unsupported';
    return fallbackLoad();
  }
  return idbHandleGet().then(function(handle){
    if(!handle){
      fsStatus = 'offer';
      return fallbackLoad();
    }
    return fsQueryGranted(handle).then(function(granted){
      if(!granted){
        /* Pasta lembrada, mas o navegador exige um gesto do usuario para reautorizar:
           mostra o aviso de reconexao e carrega o fallback enquanto isso. */
        fsPendingHandle = handle; fsStatus = 'reconnect';
        return fallbackLoad();
      }
      return loadFromDir(handle).then(function(status){
        if(status === 'loaded'){
          dirHandle = handle; fileMode = true; fsStatus = 'connected'; fsFolderName = handle.name;
          renderAll(); checkScheduledBackups();
          return;
        }
        if(status === 'invalid'){
          fsPendingHandle = handle; fsStatus = 'reconnect';
          return fallbackLoad();
        }
        /* 'new': pasta lembrada ainda sem arquivo de dados — cria a partir do fallback. */
        return loadState().then(function(s){
          state = s;
          dirHandle = handle; fileMode = true; fsStatus = 'connected'; fsFolderName = handle.name;
          return fsFlush();
        }).then(function(){ renderAll(); checkScheduledBackups(); });
      }).catch(function(){
        fsPendingHandle = handle; fsStatus = 'reconnect';
        return fallbackLoad();
      });
    });
  }).catch(function(){
    fsStatus = fsSupported ? 'offer' : 'unsupported';
    return fallbackLoad();
  });
}

/* ---- Atalhos de teclado: N = novo, / = busca, Esc = fecha modal/busca ---- */
document.addEventListener('keydown', function(e){
  var t = e.target;
  var typing = t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable);
  if(e.key==='Escape'){
    if(draftModal){ App.closeModal(); }
    else if(vinculoPanelFor){ App.fecharPainelVinculo(); }
    else if(settingsOpen){ App.closeSettings(); }
    else if(clienteHistoryModal){ App.closeClienteHistory(); }
    else if(dailyReportOpen){ App.closeDailyReport(); }
    else if(atosBalcaoModalOpen){ App.closeAtosBalcao(); }
    else if(ui.filtrosAbertos){ App.toggleFiltrosPanel(); }
    else if(ui.search){ App.setSearch(''); }
    else if(t && t.id==='searchInput'){ t.blur(); }
    return;
  }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(draftModal || vinculoPanelFor || settingsOpen || clienteHistoryModal || dailyReportOpen || atosBalcaoModalOpen) return;
  if(e.key==='n' || e.key==='N'){ e.preventDefault(); App.openNew(); }
  else if(e.key==='/'){ e.preventDefault(); var s=document.getElementById('searchInput'); if(s){ s.focus(); s.select(); } }
});

ensureStorage();
bootstrap();
setInterval(checkScheduledBackups, 60000);

})();
